[project]
name = "schiesshub-backend"
version = "0.1.0"
description = "Schiesshub – Backend (FastAPI, SQLAlchemy, PostgreSQL)"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.165.0,<0.166",
    "uvicorn[standard]>=0.54.0,<0.55",
    "sqlalchemy[asyncio]>=2.1.9,<2.2",
    "asyncpg>=0.32.0,<0.33",
    "alembic>=1.20.1,<2",
    "pydantic>=2.14.4,<3",
    "pydantic-settings>=2.16.3,<3",
    "pyyaml>=6.0.4,<7",
    "cryptography",
    "argon2-cffi",
    "reportlab",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.5.0,<2",
    "httpx>=0.28.1,<0.29",
    "ruff>=0.17.6,<0.18",
]

[tool.uv]
# Anwendung, kein installierbares Paket: Der Code liegt unter /app und wird direkt gestartet.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["app", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "ASYNC", "PT", "RUF"]
ignore = [
    # Deutsche Texte enthalten typografische Zeichen („“, –, ×).
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
