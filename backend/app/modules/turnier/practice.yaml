# Übungsturnier mit Beispieldaten (POST /tournaments/practice, Format: practice.py).
#
# Alle Personen und Vereine sind erfunden und als Übung erkennbar. Kein Geburtsdatum. Die
# Wettbewerbe entstehen frisch aus dem aktuellen Katalog; hier stehen nur Kennziffern und
# Rohwerte, keine Regeln. Rohwerte je Abschnitt (`raw: {<abschnitt>: [<serie>, …]}`) im Format
# von docs/DATENMODELL.md, „Rohwerte“.
#
# Zustände der Starts: registered (wartet), called (aufgerufen), captured (teils erfasst),
# final (abgeschlossen), aborted (abgebrochen). Starts, die einen Schützenstand belegt lassen (called,
# captured), werden zuletzt eingespielt.
schema: 1
id: "uebungsturnier"
name: "Übungsturnier"
description: "Übungsturnier mit erfundenen Personen und Ergebnissen zum Ausprobieren aller Stationen; lässt sich jederzeit rückstandsfrei entfernen."
organizer: "Übungsverein Musterstadt"
template: "open"
settings:
  protest_minutes: 30
  default_fee_first_cents: 1000
  default_fee_repeat_cents: 500
classes: { federation: "bds" }
ranges:
  - { key: "flinte", name: "Schießstand Flinte 15 m", lane_count: 2 }
  - { key: "kurzwaffe", name: "Schießstand Kurzwaffe 25 m", lane_count: 4 }
competitions:
  - { key: "fallscheibe", catalog_federation: "bds", catalog_code: "4401", range: "flinte" }
  - { key: "repetier", catalog_federation: "bds", catalog_code: "4403", range: "flinte" }
  # Präzision hat feste Zeiten je Serie und wird deshalb nach Zeitplan geplant.
  - { key: "praezision", catalog_federation: "bds", catalog_code: "1001", range: "kurzwaffe" }
# Durchgänge lückenlos hintereinander; Beginn des ersten relativ zu „jetzt“ (auf 5 Minuten
# abgerundet): Durchgang 1 ist vorbei, Durchgang 2 läuft gerade.
heats:
  - { competition: "praezision", count: 4, first_offset_minutes: -20 }
clubs:
  - { key: "uv", name: "Übungsverein Musterstadt", short: "ÜV Musterstadt" }
  - { key: "ps", name: "Probeschützen Beispielhausen", short: "PS Beispielhausen" }
  - { key: "tg", name: "Testgilde Vorlagendorf", short: "TG Vorlagendorf" }
persons:
  - name: "Anna Beispiel"
    club: "uv"
    class: "damen-1"
    starts:
      - competition: "fallscheibe"
        state: "final"
        raw:
          fallscheibe:
            - { time_cs: 742, standing: 0 }
            - { time_cs: 815, standing: 0 }
            - { time_cs: 690, standing: 1 }
            - { time_cs: 771, standing: 0 }
      - competition: "praezision"
        heat: 1
        state: "final"
        raw:
          praezision: [{ sum: 91, tens: 3 }, { sum: 88, tens: 2 }]
  - name: "Bernd Muster"
    club: "uv"
