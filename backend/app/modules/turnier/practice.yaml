            - { time_cs: 655, standing: 0 }
            - { time_cs: 702, standing: 0 }
            - { time_cs: 688, standing: 0 }
            - { time_cs: 731, standing: 0 }
        correction:
          reason: "Übung: Zeit der 3. Serie falsch abgelesen, nach Rücksprache mit der Standaufsicht korrigiert."
          raw:
            fallscheibe:
              - { time_cs: 655, standing: 0 }
              - { time_cs: 702, standing: 0 }
              - { time_cs: 698, standing: 0 }
              - { time_cs: 731, standing: 0 }
