# Klartext der Gleichstandskriterien (`wertung.gleichstand`) für Hinweise in Listen, Anzeige und
# Eingabemaske („nächstes Kriterium: Trefferfolge ab der letzten Scheibe rückwärts …“).
#
# Schlüssel = Kriterien-ID wie im Katalog. Jede ID, die in `catalog/` vorkommt, braucht hier einen
# Text (Test: `tests/scoring/test_criteria_texts.py`). Unbekannte IDs zeigt die App lesbar
# gemacht (Unterstriche → Leerzeichen).
#
# Wortlaut: DSB-Sportordnung (Stand 01.01.2027) nach `schiesshub-intern/Business/Recherche/
# dsb-begriffe.md` bzw. den Kommentaren der Katalogdateien (Fundstelle je Zeile); BDS nach
# `bds-begriffe.md`. Nur Fakten, kein Regeltext. Kurz halten: der Text steht in einem Satz
# „nächstes Kriterium: …“.

kriterien:
  # Ringwertung allgemein (DSB 0.12.1 Nr. 2 und 3; BDS A 9.03)
  zehner: "Anzahl der Zehner"
  innenzehner: "Anzahl der Innenzehner"
  # DSB 0.12.1 Nr. 2: „Zahl der 10er, 9er, 8er usw.“
  neuner_abwaerts: "Anzahl der Neuner, Achter, Siebener usw."
  # BDS L 11.04, L 12.04 (Mehrdistanz): Durchgangszeit entscheidet
  parcours_zeit: "kürzere Durchgangszeit"
  # DSB 0.12.1 Nr. 1, 9.4.1: letzte Zehnerserie, dann in 10-Schuss-Serien zurück; Flinte 3.9.1.2:
  # letzte Serie (25 Wurfscheiben) rückwärts
  letzte_serie_rueckwaerts: "letzte Zehnerserie, dann rückwärts in 10-Schuss-Serien (Wurfscheibe: je Serie)"
  # DSB 5.10.1: Schusswerte vom Ende zum Anfang
  schuesse_rueckwaerts: "Schusswerte vom letzten Schuss rückwärts"
  # DSB 4.6.1.1: höheres Ergebnis im Schnelllauf bzw. im 2. Durchgang
  ergebnis_zweite_haelfte: "höheres Ergebnis der zweiten Hälfte (Schnelllauf bzw. 2. Durchgang)"
  # DSB 5.14.2.2
  mehr_treffer: "mehr Treffer"
  # DSB 9.4.1: Gesamtergebnis in Zehnteln
  zehntel_gesamt: "Gesamtergebnis in Zehnteln"
  # DSB 6.7.8.6 (Bogen 3D)
  elfer: "Anzahl der Elfer"
  # DSB 6.4.3.1.1 (Bogen Halle)
  neuner: "Anzahl der Neuner"
  # DSB 6.6.7.6 (Bogen Feld)
  sechser: "Anzahl der Sechser"
  fuenfer: "Anzahl der Fünfer"
  # DSB 2.9, 3.9.1.1, 4.6.1 u. a.
  stechen: "Stechen"
  # DSB 5.10.1 (Armbrust national)
  abstand_letzter_schuss: "Abstand des letzten Schusses vom Zentrum"
  # DSB 5.11.4 (Armbrust national, Stern)
  abstand_letzter_treffer: "Abstand des letzten Treffers vom Plattlmittelpunkt"
  # DSB 5.12.1.1 (Armbrust national, Kombination)
  besseres_teilergebnis_scheibe: "besseres Scheibenergebnis"
  # DSB 5.11.4: ab Platz 4 ist ein Fehlschuss in einer späteren Runde besser
  fehlschuss_spaeter: "Fehlschuss in einer späteren Runde"
  # DSB 7.7.5.1 (Vorderlader)
  geringste_abweichung_aeusserster_schuss: "geringste Abweichung des am weitesten vom Zentrum liegenden Schusses"
  # DSB 5.10.1
  innensechser: "Anzahl der Innensechser"
  mouchen: "Anzahl der Mouchen"
  # DSB 4.6.1.1: wer den niedrigsten Schusswert hat, wird nachgestellt
  niedrigste_schusswerte: "niedrigste Schusswerte (wer den niedrigsten hat, wird nachgestellt)"
  # DSB 3.9.1.2 (Flinte)
  trefferfolge_rueckwaerts: "Trefferfolge ab der letzten Scheibe rückwärts bis zum ersten Fehler"
  # DSB 5.10.1: wer mehr schlechte Schusswerte hat, wird nachgestellt
  weniger_schlechte_schuesse: "weniger schlechte Schusswerte"
