# DSB – Startrecht je Wettbewerb bei der Deutschen Meisterschaft (Entwurf, nicht im Repo).
# Quelle A: DSB, 'Deutsche Meisterschaft 2025 bis 2028 – Wettbewerbe / Klassen' (2 Seiten),
#   https://www.dsb.de/fileadmin/DSB.DE/PDF/PDF_2025/Tabelle_Wettbewerbe-Klassen_Sportschiessen.pdf, abgerufen 2026-11-22.
# Quelle B: DSB, 'Bogenwettbewerbe – nach Regelteil 6 der DSB-Sportordnung (Sportjahr 2026-2028)', Stand 04.11.2025,
#   https://www.dsb.de/fileadmin/DSB.DE/PDF/PDF_2026/Tabelle_Wettbewerbe_Klassen_Bogen_2026.pdf, abgerufen 2026-11-22.
# Rekonstruktion: Wortpositionen, Gitterlinien und Zellfarben mit PyMuPDF ausgelesen, Spalten über die Gitterlinien
#   zugeordnet, danach Sichtprüfung an gerenderten Ausschnitten. Klassennummern als Text; Bedeutung je 'satz' (klassen.yaml).
# Legende Quelle A: E = Einzel, M = Mannschaft; 'b NN' = startet bei Klasse NN; gelb = olympische Wettbewerbe und Klassen;
#   grün = 'Startmöglichkeit nach SpO 0.7.1.1'; rot = 'Kein Startrecht'. Hellblau ('Änderungen gegenüber letztem
#   Sportjahr') kommt in keiner Zelle vor. Bei Klassen mit zwei Spalten ist die linke E, die rechte M.
# Felder: einzel/mannschaft = ausgeschriebene Klassen; startet_bei = Einzel-Zelle 'b NN'; mannschaft_startet_bei =
#   Mannschafts-Zelle 'b NN' bzw. 'M NN'; olympisch = gelbe Zelle; startmoeglichkeit_0711 = grün ohne Eintrag;
#   kein_startrecht = rot; endkampf = orange Zelle (nur Auflage); mix_team = verbundene Team-Zellen;
#   neu_bei_dm = hellblau (nur Bogen).
# geprüft 2026-11-22: alle 98 Einträge Zelle für Zelle gegen gerenderte Ausschnitte beider Tabellen geprüft (Quelle A S. 1–2,
#   Quelle B), ohne Abweichung. Die offen-Einträge 2.45–2.60 (40 grün, 41 'b 10') und 8.12 (verbundene M-Zelle) sind so in der
#   Tabelle gedruckt; die Bedeutung bleibt offen. Bogen-Mannschaften bleiben offen (Tabelle B nennt nur Einzel).
schema: 1
verband: "dsb"
stand_tabelle: "DM 2025–2028 (Sportschießen), DM 2026–2028 (Bogen)"
hinweise:
  - "Mannschaft = drei Schützen desselben Vereins und derselben Wettkampfklasse; Abweichung per Ausschreibung als offene Klasse (SpO 0.7.2.2, Stand 01.01.2027). b-NN-Einträge in M-Spalten sind solche Abweichungen der DM-Tabelle."
  - "Starten Schützen in Mannschaften einer leistungsstärkeren Klasse, wird ihr Einzelergebnis in ihrer eigenen Klasse gewertet (SpO 0.7.1.1)."
  - "Sitzendanschlag Auflage (Legende unter der Auflagetabelle): Senioren I/II (70–73) nur mit Hilfsmittelausweis, Senioren III–VI (74–81) generell erlaubt."
  - "Höhermeldung lt. Sportordnung zu Beginn des Sportjahres möglich (Hinweis unter der Auflagetabelle; SpO 0.7.1.1, 9.1.1)."
  - "Grüne Zellen sind keine eigene Wertung: Wer dort steht, kann in der nach SpO 0.7.1.1 nächsthöheren bzw. leistungsstärkeren ausgeschriebenen Klasse starten."
