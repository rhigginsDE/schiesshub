# DSB-Wettkampfklassen (Entwurf). Pflege: siehe catalog/README.md. Nur Fakten, keine Regeltexte.
# Quelle: Sportordnung des DSB, Stand 01.01.2027 (online: https://dsb.de/fileadmin/dsb/sportordnung/, abgerufen 2026-11-22),
#   Teil 0 Seite 20–22 (0.7.1, 0.7.1.1), Teil 0 Seite 4 (0.2), Teil 0 Seite 3 (0.1.5), Teil 6 Seite 2 (6.1.2), Teil 9 Seite 1 (9.1),
#   Teil 10 Seite 1 und 14 (10, 10.12), Teil 11 Seite 1 (11.1), Teil 12 Seite 1 (12.1), Teil 13 Seite 1 (13.1.1).
# Abgleich 2026 → 2027: Die Synopse 01.01.2026 → 01.01.2027 enthält in 0.7 nur eine Änderung an 0.7.3 (Hilfsmittelausweis),
#   keine an 0.7.1/0.7.1.1. Die Klassentabellen sind wortgleich mit dem Auszug SpO Stand 01.01.2025 (Teil 0 S. 19–20)
#   und dem TK-Schreiben vom 30.10.2024 ("Neue Wettkampfklassen ab Sportjahr 2025"). Neu 2027: Teil 13 Bogenlaufen.
#
# Wichtig: Schiesshub speichert kein Geburtsdatum. Die Klasse wird bei der Anmeldung von Hand gewählt.
# Altersangaben sind nur Hilfetext.
#
# VORGESCHLAGENE ERWEITERUNGEN (noch nicht in fileformat.py):
#   Klasse.nummer   – offizielle DSB-Klassennummer als Text ("10"). Nur innerhalb eines Satzes eindeutig!
#   Klasse.satz     – Klassensatz (Tabelle der SpO), siehe 'klassensaetze'.
#   Klasse.hoeher_in – Klassen, in die nach SpO 0.7.1.1 höher gemeldet werden darf (Liste von IDs).
#   Datei.klassensaetze – Beschreibung je Satz mit Abschnitt.
#   Klassen-IDs sind eindeutig über alle Sätze; die Nummer allein ist es nicht (z. B. "20" = Schüler m (Kugel),
#   Schüler A m (Bogen), Schüler I m (Blasrohr)).
schema: 1
verband: "dsb"
quelle:
  regelwerk: "Sportordnung des Deutschen Schützenbundes"
  stand: "2027-01-01"
  abschnitte: ["0.1.5", "0.2", "0.7.1", "0.7.1.1", "0.7.2.2", "6.1.2", "9.1", "10", "10.12", "11.1", "12.1", "13.1.1"]
geprueft: false

klassensaetze:
  sportschiessen: "Kugel-, Target-Sprint- und Sommerbiathlonwettbewerbe (SpO 0.7.1, Tabelle 1). Gilt auch für Flinte Trap/Skeet/Doppeltrap, Armbrust, Laufende Scheibe, Vorderlader."
  auflage: "Auflagewettbewerbe (SpO 0.7.1 und 9.1)."
  flinte-fitasc: "FITASC-Wettbewerbe (SpO 0.7.1)."
  bogen: "Bogenwettbewerbe (SpO 0.7.1 und 6.1.2)."
  bogenlaufen: "Bogenlaufen (SpO Teil 13, neu ab 01.01.2027). Keine Klassennummern."
  licht: "Lichtschießen (SpO 11.1)."
  blasrohr: "Blasrohrsport (SpO 12.1): Schülerklassen eigen, sonst Satz 'sportschiessen'."
  para: "Para-Sportschießen (SpO 10, 10.12)."

stichtag:
  # SpO 0.1.5: Sportjahr = Kalenderjahr. SpO 0.7.1: Berechnungszeitraum für die Klassen ist das Sportjahr.
  sportjahr: "kalenderjahr"
  bezug: "alter_im_sportjahr"
  hinweis: "Berechnungszeitraum ist das Sportjahr (SpO 0.7.1, ebenso 6.1, 9.1.1, 13.1.1); Sportjahr = Kalenderjahr (SpO 0.1.5). Landesverbände dürfen Meisterschaften unterhalb der LM bis zu drei Monate vor Beginn des Sportjahres schießen lassen (0.1.5)."
  unsicher: true

