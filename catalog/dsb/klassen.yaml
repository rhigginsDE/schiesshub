regeln:
  - "Mindestalter nach Waffenrecht (SpO 0.2, Stand 01.01.2027; § 27 Abs. 3 WaffG): Kinder ab vollendetem 12. bis unter 14 Jahren nur mit Druckluft-, Federdruck- und Kaltgaswaffen."
  - "Jugendliche ab vollendetem 14. bis unter 18 Jahren zusätzlich mit Randfeuer bis 5,6 mm (.22 l.r.) bei höchstens 200 J sowie mit Einzellader-Langwaffen mit glattem Lauf bis Kaliber 12 (SpO 0.2; § 27 Abs. 3 Nr. 2 WaffG)."
  - "Mit allen anderen Waffen erst ab vollendetem 18. Lebensjahr (SpO 0.2). Bei Minderjährigen schriftliches Einverständnis der Sorgeberechtigten, wenn diese nicht anwesend sind (SpO 0.2; § 27 Abs. 3 WaffG: schriftlich oder elektronisch)."
  - "Ausnahmen vom Mindestalter durch die zuständige Behörde möglich (SpO 0.2); für Kinder zur Förderung des Leistungssports nach § 27 Abs. 4 WaffG."
  - "Vorderlader (DM-Tabelle): 'ab 18 Jahre'; Erlaubnis nach § 27 Sprengstoffgesetz vorzulegen."
  - "Höhermeldung: zu Beginn des Sportjahres per Erklärung über den Verein beim Landesverband, bindend für das ganze Sportjahr in allen Wettbewerben; getrennt nach Bogen, Auflage und übrigen Wettbewerben (SpO 0.7.1.1)."
  - "Höhermeldungen in Auflageklassen wirken sich nicht auf die allgemeine Klasseneinteilung aus (SpO 0.7.1, 9.1.1)."
  - "Ist eine Klasse in einem Wettbewerb nicht ausgeschrieben, darf der Schütze die nach dem Schema nächsthöhere bzw. leistungsstärkere Klasse wählen, notfalls die leistungsstärkste (SpO 0.7.1.1). Die Wahl teilt bei Einzel der Schütze, bei Mannschaft der Verein mit der Meldung mit."
  - "In Mannschaften einer leistungsstärkeren Klasse zählt das Einzelergebnis in der eigenen Klasse (SpO 0.7.1.1)."
  - "Mannschaft: drei Schützen desselben Vereins und derselben Klasse, Abweichung per Ausschreibung (offene Klasse) bzw. Ligaordnung (SpO 0.7.2.2)."
  - "Welche Klasse in welchem Wettbewerb startet bzw. bei welcher Klasse mitschießt ('b NN'), steht je Wettbewerb in startrecht.yaml (DM-Tabellen). Eine allgemeine Zusammenlegungsregel nennt die SpO nicht; daher zusammenlegen_in überall leer."

unsicher:
  - "Stichtag: SpO sagt nur 'Berechnungszeitraum ist das Sportjahr'. Gängige Lesart: maßgeblich ist das Alter, das im Kalenderjahr erreicht wird. Nicht wörtlich in der SpO."
  - "hoeher_in ist aus der Grafik in 0.7.1.1 (Teil 0 S. 22) gelesen; deren Beschriftung liegt online nur als Textfolge vor (Junioren I/II → Herren I bzw. Damen I; aus jeder Altersklasse II–V in jede jüngere bis I). Ob Junioren II in Junioren I höher melden dürfen, zeigt die Grafik nicht."
  - "FITASC: Die SpO-Tabelle nennt für Junioren, Senioren, Veteranen, Master kein Geschlecht; Damen ab 15 sind eine eigene Klasse."
  # geprüft 2026-11-22: ergänzt nach Sichtprüfung der DM-Tabelle 2025–2028, Seite 2.
  - "FITASC: Die DM-Tabelle 2025–2028 weicht bei den Altersangaben von SpO 0.7.1 ab (Herren 21–55 statt 21–56, Senioren 56–65 statt 57–65, Damen '21 – …' statt ab 15). alter_hilfe folgt der SpO; vor der DM die Ausschreibung prüfen."
  - "Blasrohr: SpO 12.1 nennt Schüler I/II/III (20/21, 22/23, 24/25); die DM-Tabelle nennt 20/21 'Schüler' und Schüler III '7 – 10'. alter_hilfe folgt der SpO."
  - "Bogen: Regeln zur Höhermeldung im Bogen (außer 'getrennt behandelt', 0.7.1.1) nicht geprüft."
  - "Para: 'ab dem 15. Lebensjahr' (SpO 10) lässt offen, ob vollendetes 14. oder 15. Lebensjahr gemeint ist."
  - "Divers: Die SpO 2027 nennt in 0.7.1 keine Diversklasse."
