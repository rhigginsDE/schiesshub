# Impressum), offizielles Gesamt-PDF DSB-Sportordnung_2027.pdf, 560 Seiten. Änderungen gegenüber der
# Ausgabe 01.01.2026 laut Synopse sind in der Recherche-Notiz (intern) aufgelistet.
