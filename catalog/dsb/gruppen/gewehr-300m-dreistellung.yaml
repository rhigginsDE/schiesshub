disziplinen:
  - kennziffer: "1.50"
    name: "GK-Standardgewehr 300 m 3×20"
    waffe: "GK-Standardgewehr, Einzellader (Mehrlader als Einzellader); max. 5500 g, Lauflänge max. 762 mm; Maße nach 1.5.4; dasselbe Gewehr für alle Stellungen (1.5.2)"
    munition: "bis 8 mm, Zentralfeuer"
    visierung: "Diopter/Korn; kein Zielfernrohr"
    anschlag: "kniend (ab Herren II/Damen II auch sitzend, 1.6) – liegend – stehend"
    scheibe: "DSB-Scheibe Nr. 5 (Gewehr 300 m)"
    ablauf: "gk-standard-3x20"
    hinweis: "Teil 1 S. 21: '3×20 Männer'. Abzugswiderstand mind. 1500 g, kein Stecher; Laufbeschwerung radial max. 30 mm, nicht über die Mündung; Flimmerband max. 60 mm, kein Zweibein. Unterhalb LM Halbprogramm. Nicht in der DM-Tabelle 2025–2028."
  - kennziffer: "1.53"
    name: "GK-Standardgewehr Mehrlader 300 m"
    waffe: "GK-Standardgewehr, Mehrlader (Einzellader zulässig); Lauflänge 40–76,2 cm"
    munition: "bis 8 mm"
    visierung: "Diopter/Korn"
    anschlag: "kniend (ab Herren II/Damen II auch sitzend, 1.6) – liegend – stehend"
    scheibe: "DSB-Scheibe Nr. 5 (Gewehr 300 m)"
    ablauf: "gk-3x20-150"
    hinweis: "Nur in 0.21 geregelt (60 Schuss), Einzelheiten laut Ausschreibung. Nicht in der DM-Tabelle 2025–2028."
