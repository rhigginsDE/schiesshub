# Gewehr 300 m Dreistellung (Großkaliber) – DSB-Disziplinen (ENTWURF)
# Pflege: siehe catalog/README.md. Nur Fakten eintragen, keine Regeltexte kopieren.
# Quelle: DSB-Sportordnung, Stand 01.01.2027 (Blätterkatalog, abgerufen 2026-11-22): Teil 1: 1.1.1–1.1.4, 1.4.7, 1.5.2
#   (300 m Standardgewehr), 1.5.4 (Abmessungen), 1.6, Wettbewerbstabelle (Teil 1 S. 19/20), Schusszahlen/Schießzeiten
#   (Teil 1 S. 21); Teil 0: 0.21 (Teil 0 S. 77–79), Scheibe Nr. 5 (Gewehr 300 m, Teil 0 S. 65), 0.12.1.
# 1.50, 1.59, 1.70: Gesamtzeit für alle Stellungen (Teil 1 S. 21) ohne 15 Min. Vorbereitung vor kniend (Anmerkung *).
#   Teil 1 S. 19/20: "unterhalb LM Halbprogramm" bei 1.50 und 1.70; Zeiten für das Halbprogramm nennt die SpO nicht.
# 1.53 nur in 0.21. Keine dieser Disziplinen steht in der DM-Tabelle 2025–2028 (dort nur 1.90).
# Gesamtzeit im vorgeschlagenen Feld Variante.wettkampfzeit_gesamt_s (siehe Formatbedarf). Wechselzeit nicht geregelt.
# Änderungen 2026→2027: keine an diesen Abläufen.
