    visierung: "Diopter/Korn; Wasserwaage erlaubt; kein Zielfernrohr"
    anschlag: "kniend (ab Herren II/Damen II auch sitzend, 1.6) – liegend – stehend"
    scheibe: "DSB-Scheibe Nr. 5 (Gewehr 300 m)"
    ablauf: "gk-sport-3x20"
    hinweis: "Teil 1 S. 21: '3×20 Frauen'. Abzug frei, Laufbeschwerung beliebig, Flimmerband max. 60 mm. Nicht in der DM-Tabelle 2025–2028."
  - kennziffer: "1.70"
    name: "GK-Freigewehr 300 m 3×40"
