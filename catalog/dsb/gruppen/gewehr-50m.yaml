# Gewehr 50 m (ein Anschlag, ganze Ringe) – DSB-Disziplinen (ENTWURF)
# Pflege: siehe catalog/README.md. Nur Fakten eintragen, keine Regeltexte kopieren.
# Quelle: DSB-Sportordnung, Stand 01.01.2027 (Blätterkatalog, abgerufen 2026-11-22): Teil 1: 1.1.1, 1.1.2, 1.5.1 (Visierung),
#   Wettbewerbstabelle (Teil 1 S. 19), Schusszahlen/Schießzeiten (Teil 1 S. 21); Teil 0: 0.21 (Teil 0 S. 77–80),
#   Scheibe Nr. 3 (50 m Gewehr, Teil 0 S. 64), 0.12.1. DM: 1.42 mit 30 Schuss, ganze Ringe (DSB-Schusszahlentabelle).
# KK-Liegendkampf 1.80 steht wegen der Zehntelwertung auf LM/DM in eigener Gruppe (gewehr-50m-kk-liegend).
# 1.45, 1.85, 1.91, 1.96 stehen nur in 0.21 ("Beschreibung entsprechend Ausschreibung"); nicht in der DM-Tabelle.
#   0.21 nennt dort teils nur EINE Zeit ohne "*" (1.45: 30 Min., 1.85: 45 Min.) – ob für Zuganlage oder alle Systeme, offen.
#   Vorbereitungszeit regelt 0.21 für diese nicht.
# 1.37 GK 50 m Feuerstutzen fehlt absichtlich: 0.21 nennt keine Schusszahl (siehe Notiz).
# Änderungen 2026→2027: keine an diesen Disziplinen.
