# Auflage 15 m Zimmerstutzen – DSB-Disziplinen
# Pflege: siehe catalog/README.md. Nur Fakten eintragen, keine Regeltexte kopieren.
# Quelle: DSB-Sportordnung, Stand 01.01.2027 (Blätterkatalog dsb.de/fileadmin/dsb/sportordnung/, abgerufen 2026-11-22),
#   Teil 9: 9.1–9.8 und Wettbewerbstabelle Auflagewettbewerbe (Teil 9 S. 8); Teil 0: Wettbewerbstabelle 0.21
#   (Teil 0 S. 76), Scheiben 0.20, Ergebnisgleichheit 0.12, Mannschaft 0.7.2.2.
# Anschlag: Kl. 70–73 (Senioren I–II) nur stehend aufgelegt; Kl. 74–81 (Senioren III–VI) stehend oder sitzend
#   aufgelegt auf Hocker ohne Lehne (9.7.6.1). Ganzer Wettkampf im gleichen Anschlag (9.7.6 Nr. 9).
#   Sitzend auch für Para-Sportschützen mit Hilfsmittelausweis bzw. Eintrag G/aG im Schwerbehindertenausweis (9.7.7).
# Änderungen 2026→2027 in Teil 9 (Synopse 01.01.2027): nur Ausrüstung (9.7.2 Schaftkappe, 9.7.3 Visierlinien-
#   rückverlagerung) und 9.8.3.1 (nichtzielender Arm keine Stütze); Schusszahl, Zeiten, Wertung unverändert.
schema: 1
verband: "dsb"
gruppe:
  id: "auflage-15m"
  name: "Auflage 15 m Zimmerstutzen"
  waffenart: "langwaffe"
  distanz_m: 15
  art: "auflage"
wertung:
  modell: "ringe"
  rangfolge: "absteigend"
  # Volle Ringe: 1.31 steht nicht in der Zehntelliste von 9.4 (Teil 9 S. 2), daher kein zehntelwertung.
  # SpO 9.4.1 (volle Ringwertung, Plätze 1–6; Teil 9 S. 2): Zehnerserien von hinten, Anzahl 10er/9er/8er …,
  #   Innenzehner (auf Scheibe 2 nicht vorhanden), Gesamtergebnis in Zehnteln; dann gleicher Rang.
  #   Ab Platz 7 gilt über 9.4 die Regel 0.12.1 (Teil 0 S. 43, gleiche Kette ohne Zehntel). Beides kann das Format nicht trennen (Formatbedarf).
  # hoechstergebnis_gleicher_rang bewusst nicht gesetzt: Bei 300 Ringen entscheidet ein Stechen (9.4.3, Teil 9
  #   S. 3), nicht 0.12.1 Satz 1. Das Format kann dieses Stechen nicht abbilden (Formatbedarf).
  # innenzehner gestrichen (2026-11-25): Scheibe Nr. 2 hat keinen Innenzehner (0.20, Teil 0 S. 62 und S. 64,
  #   als Bild geprüft; anders als Scheibe 1 und 3). 9.4.1 Nr. 3 läuft hier daher leer.
  gleichstand: ["letzte_serie_rueckwaerts", "zehner", "neuner_abwaerts", "zehntel_gesamt"]
  stechen_bei_hoechstergebnis: true # SpO 9.4.3 (Teil 9 S. 3): bei 300 Ringen entscheidet ein Stechen
  # geprüft 2026-11-25 (zweite Prüfung): alle Werte gegen 0.21 (Teil 0 S. 76), Tabelle Teil 9 S. 8, 9.1–9.4, 9.7.
  geprueft: true
ablaeufe:
  auflage-30-15m:
    beschreibung: "30 Schuss aufgelegt; 55 Min. (Zuganlage) bzw. 50 Min. (andere Systeme) inkl. Probe"
    varianten:
      - id: "zuganlage"
        name: "Zuganlage"
        abschnitte:
          - id: "wertung"
            name: "Wertung"
            # 30 Wertungsschüsse (9.2); 3 Zehnerserien wie in 9.4.1 und 0.11.5.2 (Teil 0 S. 43).
            serien: 3
            schuss_je_serie: 10
            probeschuesse: "unbegrenzt"   # SpO 9.2, nur vor dem ersten Wertungsschuss
            wettkampfzeit_s: 3300   # 55 Min. inkl. Probe (9.3; Tabelle Teil 9 S. 8)
            positionen:
              - { nr: 1, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
              - { nr: 2, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
              - { nr: 3, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
      - id: "andere-systeme"
        name: "Andere Systeme (z. B. elektronische Scheiben)"
        abschnitte:
          - id: "wertung"
            name: "Wertung"
            # 30 Wertungsschüsse (9.2); 3 Zehnerserien wie in 9.4.1 und 0.11.5.2 (Teil 0 S. 43).
            serien: 3
            schuss_je_serie: 10
            probeschuesse: "unbegrenzt"   # SpO 9.2, nur vor dem ersten Wertungsschuss
            wettkampfzeit_s: 3000   # 50 Min. inkl. Probe (9.3; Tabelle Teil 9 S. 8)
            positionen:
              - { nr: 1, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
              - { nr: 2, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
              - { nr: 3, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
disziplinen:
  - kennziffer: "1.31"
    # geprüft 2026-11-22: name "Zimmerstutzen Auflage" → "Zimmerstutzen Auflage 15 m" (Wettbewerbstabelle 0.21, Teil 0 S. 76).
    name: "Zimmerstutzen Auflage 15 m"
    waffe: "Zimmerstutzen (Einzellader)"
    munition: "bis 4,65 mm Randzünder"
    visierung: "Diopter/Korn (optische Zielhilfsmittel nach 0.5.3.1)"
    anschlag: "stehend aufgelegt (Kl. 70–73); stehend oder sitzend aufgelegt (Kl. 74–81)"
    scheibe: "DSB-Scheibe Nr. 2 (15 m Gewehr)"
    ablauf: "auflage-30-15m"
    hinweis: "Max. 7500 g; Stecher erlaubt; Auflagepunkt max. 550 mm ab Systemeinbettung, Auflagenbreite max. 60 mm; max. 1 Schuss je Scheibe. 9.4 nennt keine Zehntelwertung. Nicht in der DM-Tabelle 2025–2028."
    optional: true
