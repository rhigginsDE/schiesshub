# Auflage 10 m Armbrust – DSB-Disziplinen
# Pflege: siehe catalog/README.md. Nur Fakten eintragen, keine Regeltexte kopieren.
# Quelle: DSB-Sportordnung, Stand 01.01.2027 (Blätterkatalog dsb.de/fileadmin/dsb/sportordnung/, abgerufen 2026-11-22),
#   Teil 9: 9.1–9.8 und Wettbewerbstabelle Auflagewettbewerbe (Teil 9 S. 8); Teil 0: Wettbewerbstabelle 0.21
#   (Teil 0 S. 85), Scheiben 0.20, Ergebnisgleichheit 0.12, Mannschaft 0.7.2.2.
# Anschlag: Kl. 70–73 (Senioren I–II) nur stehend aufgelegt; Kl. 74–81 (Senioren III–VI) stehend oder sitzend
#   aufgelegt auf Hocker ohne Lehne (9.7.6.1). Ganzer Wettkampf im gleichen Anschlag (9.7.6 Nr. 9).
#   Sitzend auch für Para-Sportschützen mit Hilfsmittelausweis bzw. Eintrag G/aG im Schwerbehindertenausweis (9.7.7).
# Änderungen 2026→2027 in Teil 9 (Synopse 01.01.2027): nur Ausrüstung (9.7.2 Schaftkappe, 9.7.3 Visierlinien-
#   rückverlagerung) und 9.8.3.1 (nichtzielender Arm keine Stütze); Schusszahl, Zeiten, Wertung unverändert.
schema: 1
verband: "dsb"
gruppe:
  id: "auflage-10m-armbrust"
  name: "Auflage 10 m Armbrust"
  waffenart: "armbrust"
  distanz_m: 10
  art: "auflage"
wertung:
  modell: "ringe"
  rangfolge: "absteigend"
  # Volle Ringe: 5.11 steht nicht in der Zehntelliste von 9.4 (Teil 9 S. 2), daher kein zehntelwertung.
  # SpO 9.4.1 (volle Ringwertung, Plätze 1–6; Teil 9 S. 2): Zehnerserien von hinten, Anzahl 10er/9er/8er …,
  #   Innenzehner, Gesamtergebnis in Zehnteln; dann gleicher Rang. Ab Platz 7 gilt über 9.4 die Regel 0.12.1
  #   (Teil 0 S. 43, gleiche Kette ohne Zehntel). Beides kann das Format nicht trennen (Formatbedarf).
  # hoechstergebnis_gleicher_rang bewusst nicht gesetzt: Bei 300 Ringen entscheidet ein Stechen (9.4.3, Teil 9
  #   S. 3), nicht 0.12.1 Satz 1. Das Format kann dieses Stechen nicht abbilden (Formatbedarf).
  gleichstand: ["letzte_serie_rueckwaerts", "zehner", "neuner_abwaerts", "innenzehner", "zehntel_gesamt"]
  stechen_bei_hoechstergebnis: true # SpO 9.4.3 (Teil 9 S. 3): bei 300 Ringen entscheidet ein Stechen
  # geprüft 2026-11-25 (zweite Prüfung): alle Werte gegen 0.21 (Teil 0 S. 85), Tabelle Teil 9 S. 8, 9.1–9.4, 9.7.
  geprueft: true
ablaeufe:
  auflage-30-70min:
    beschreibung: "30 Schuss aufgelegt; 70 Min. inkl. Probe"
    varianten:
      - id: "standard"
        name: "Standard"
        abschnitte:
          - id: "wertung"
            name: "Wertung"
            # 30 Wertungsschüsse (9.2); 3 Zehnerserien wie in 9.4.1 und 0.11.5.2 (Teil 0 S. 43).
            serien: 3
            schuss_je_serie: 10
            probeschuesse: "unbegrenzt"   # SpO 9.2, nur vor dem ersten Wertungsschuss
            # 70 Min. inkl. Probe = 4200 s: Tabelle Teil 9 S. 8 (nur eine Zeit, keine für andere Systeme) und
            #   0.21 (Teil 0 S. 85, ohne Sternzeit). Die allgemeine 10-m-Zeit aus 9.3 (55/45 Min.) gilt für 5.11
            #   nicht, beide disziplinbezogenen Stellen nennen übereinstimmend 70 Min.
            wettkampfzeit_s: 4200
            positionen:
              - { nr: 1, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
              - { nr: 2, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
              - { nr: 3, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
disziplinen:
  - kennziffer: "5.11"
    name: "Armbrust 10 m Auflage"
    waffe: "Armbrust"
    munition: "Bolzen 4,5 mm (Toleranz 0,05 mm)"
    visierung: "Diopter/Korn"
    anschlag: "stehend aufgelegt (Kl. 70–73); stehend oder sitzend aufgelegt (Kl. 74–81)"
    scheibe: "DSB-Scheibe Nr. 1 (10 m Gewehr/Armbrust)"
    ablauf: "auflage-30-70min"
    # Anschlag: Tabelle Teil 9 S. 8 nennt für 5.11 Kl. 70–73 stehend, Kl. 74–81 auch sitzend aufgelegt (dazu
    #   9.7.6.1). 0.21 nennt nur "stehend" und verweist für die Beschreibung auf die Tabelle Teil 9; diese gilt.
    hinweis: "Max. 6750 g; Sehnenlänge max. 608 mm; Visierlänge max. 860 mm; Wasserwaage erlaubt; Schaftbeschwerung unterhalb des Schaftes erlaubt; Auflage bis Schaftende, Breite max. 60 mm; max. 1 Schuss je Scheibe (Tabelle Teil 9 S. 8). Teil 0 nennt als Anschlag nur „stehend“. Nicht in der DM-Tabelle 2025–2028."
    optional: true
