#   2.22 (2.60), Pistolentabelle (S. 23), Schießzeitentabelle (S. 24–25); Teil 0: 0.12.1, 0.20 (Scheiben Nr. 4 und 10),
#   0.21 (S. 81–82); Teil 15: 15.1.1.1, Finalabläufe 25 m Schnellfeuerpistole und 25 m Pistole (Teil 15 S. 23–29).
#   Schusszahlen/Finalklassen DM: Schusszahlentabelle der DM-Ausschreibung (Stand 21.01.2026); Klassen: DM-Tabelle 2025–2028.
# Änderungen 2026→2027 (Synopse): 2.3.1 Nachladen während der Wettkampfzeit ohne Genehmigung führt zur Disqualifikation;
