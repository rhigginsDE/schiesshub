disziplinen:
  - kennziffer: "2.30"
    name: "25 m Schnellfeuerpistole"
    waffe: "selbstladende Pistole"
    munition: "5,6 mm Randfeuer (.22 lfb); Geschoss mind. 2,53 g (39 grs), v0 mind. 250 m/s"
    visierung: "offene Visierung (Kimme/Korn), schwarz; keine optischen Hilfen"
    anschlag: "stehend frei, einhändig; jede Serie aus der Fertighaltung (SpO 2.6)"
    scheibe: "DSB-Scheibe Nr. 10 (25 m Schnellfeuer/Duell)"
    ablauf: "schnellfeuer-2x30"
    # geprüft 2026-11-22: "keine Kompensatoren/Mündungsbremsen" um Gasentlastung ergänzt (Pistolentabelle Teil 2 S. 23,
    #   gilt für alle 25-m-Wettbewerbe 2.30–2.60).
    hinweis: "Gewicht ≤ 1400 g, Abzug ≥ 1000 g, Prüfkasten 300×150×50 mm, Lauf ≤ 153 mm, Visierlinie ≤ 220 mm; Gasentlastung, Kompensatoren und Mündungsbremsen nicht erlaubt. Je Scheibe und Serie 1 Schuss. Vorlaufzeit 7 s (SpO 2.5.1). Stechserie: 4-s-Serie."
  - kennziffer: "2.31"
    name: "25 m Schnellfeuerpistole – Nachwuchswettbewerb"
    waffe: "selbstladende Pistole"
    munition: "5,6 mm Randfeuer (.22 lfb)"
    visierung: "offene Visierung (Kimme/Korn), schwarz; keine optischen Hilfen"
    anschlag: "stehend frei, einhändig; jede Serie aus der Fertighaltung (SpO 2.6)"
    scheibe: "DSB-Scheibe Nr. 10 (25 m Schnellfeuer/Duell)"
    ablauf: "schnellfeuer-nachwuchs-2x30"
    hinweis: "Waffe wie 2.30 (Pistolentabelle). Stechserie: 6-s-Serie (SpO 2.17.3). Nicht in der DM-Tabelle 2025–2028."
    optional: true
    pruefen: ["ablauf"]
