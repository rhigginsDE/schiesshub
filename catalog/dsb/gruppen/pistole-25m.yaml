    anschlag: "stehend frei, einhändig; Duell aus der Fertighaltung vor jedem Schuss (SpO 2.18.3.3)"
    scheibe: "Präzision: DSB-Scheibe Nr. 4; Duell: DSB-Scheibe Nr. 10"
