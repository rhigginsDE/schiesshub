    finale:
      teilnehmer: 8
      hinweis: "Wertung beginnt bei null. Ranking-Match: je 2×5 Schuss kniend (200 s), liegend (150 s), stehend (250 s); 6 Min. Vorbereitung/Probe vor kniend, Wechsel- und Probezeit 6 Min. (kniend→liegend) und 8 Min. (liegend→stehend); nach 30, 35, 40 Schuss scheiden je 2 aus. Medaillen-Match der besten 2: Einzelschüsse in je 50 s in Zehnteln, 2/1/0 Punkte je Schuss, Sieg ab 16 Punkten. DM: nur Herren I, Damen I, Junioren I m/w."
      abschnitt: "15.1.1; Teil 15 S. 18–22"
