# Gewehr 50 m Dreistellung – DSB-Disziplinen (ENTWURF)
# Pflege: siehe catalog/README.md. Nur Fakten eintragen, keine Regeltexte kopieren.
# Quelle: DSB-Sportordnung, Stand 01.01.2027 (Blätterkatalog, abgerufen 2026-11-22): Teil 1: 1.1.1–1.1.4 (Anschläge),
#   1.6 (Reihenfolge kniend – liegend – stehend, kniend ab Herren II/Damen II auch sitzend; bei KK 3×20 und 3×40 Wechsel
#   von Gewehr und Zubehör zwischen den Stellungen erlaubt), Wettbewerbstabelle (Teil 1 S. 19/20), Schusszahlen/
#   Schießzeiten (Teil 1 S. 21); Teil 0: 0.21 (Teil 0 S. 77–79), Scheibe Nr. 3, 0.12.1;
#   Teil 15: 15.1.1 und "Finale – Dreistellungskampf 50 m Gewehr" (Teil 15 S. 18–22).
#   DM-Schusszahl und Finalklassen: DSB-Schusszahlentabelle (Ausschreibung DM, Stand 20.11.2025).
# ZEITEN: Teil 1 S. 21 nennt für 1.40 und 1.60 nur eine GESAMTZEIT für alle drei Stellungen (ohne die 15 Min.
#   Vorbereitung vor dem Kniendanschlag). Probe vor liegend und stehend liegt im Ermessen des Schützen und zählt zur
#   Schießzeit. Gesamtzeit hier im vorgeschlagenen Feld Variante.wettkampfzeit_gesamt_s (siehe Formatbedarf in der Notiz).
#   Eine eigene Wechselzeit zwischen den Stellungen nennt Teil 1 für den Vorkampf nicht.
# Sitzend statt kniend nur ab Herren II/Damen II (1.6) – als erlaubte Alternative in positionen, Klassengrenze im Hinweis.
# Änderungen 2026→2027: keine an diesen Abläufen (Synopse: nur Ausrüstung 1.4.6, 1.4.8, 1.5.1; Para-Tabelle Teil 10).
schema: 1
verband: "dsb"
gruppe:
  id: "gewehr-50m-dreistellung"
  name: "Gewehr 50 m Dreistellung"
  waffenart: "langwaffe"
  distanz_m: 50
  art: "dreistellung"
wertung:
