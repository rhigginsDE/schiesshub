# Armbrust 30 m international – DSB-Disziplinen
# Pflege: siehe catalog/README.md. Nur Fakten eintragen, keine Regeltexte kopieren.
# Quelle: DSB-Sportordnung, Stand 01.01.2027 (Blätterkatalog, abgerufen 2026-11-22), Teil 5: 5 (Allgemein), 5.1.2,
#   5.2.1, 5.5.1, 5.6, 5.8 und Wettbewerbstabelle Armbrust (Teil 5 S. 17); Teil 0: 0.21 (S. 85), Scheibe Nr. 16
#   (0.20, S. 71), 0.12.1. DM-Klassen: Tabelle Wettbewerbe/Klassen DM 2025–2028.
# Änderungen 2026→2027 in Teil 5: keine.
# Teil 5 gilt abweichend oder ergänzend zu Teil 0 und zu den allgemeinen Gewehrregeln (Teil 5 S. 1).
# Zweite Prüfung 2026-11-25: alle Werte gegen Teil 5 S. 1, 4–5, 17 (Tabelle als Bild), 0.21 (Teil 0 S. 85),
#   Scheibe Nr. 16 (Teil 0 S. 71), 0.11.5.2 und 0.12.1 (Teil 0 S. 43) abgeglichen.
schema: 1
verband: "dsb"
gruppe:
  id: "armbrust-30m"
  name: "Armbrust 30 m international"
  waffenart: "armbrust"
  distanz_m: 30
  art: "praezision"
wertung:
  modell: "ringe"
  rangfolge: "absteigend"
  # Keine eigene Regel in Teil 5 für 5.20, daher SpO 0.12.1. Scheibe Nr. 16 hat einen Innenzehner (Ø 2 mm).
  gleichstand: ["letzte_serie_rueckwaerts", "zehner", "neuner_abwaerts", "innenzehner"]
  hoechstergebnis_gleicher_rang: true # SpO 0.12.1 Satz 1 (Teil 0 S. 43)
  geprueft: true # zweite Prüfung 2026-11-25: alle Werte mit SpO 2027 belegt, nur pruefen "waffe" (Stammdaten) offen
ablaeufe:
  armbrust-30m-2x30:
    beschreibung: "30 Schuss stehend in 90 Min., 30 Min. Umbau, 30 Schuss kniend in 90 Min."
    varianten:
      - id: "standard"
        name: "Standard"
        abschnitte:
          - id: "stehend"
            name: "Stehend"
            # Reihenfolge stehend → kniend: so in Tabelle Teil 5 S. 17 (stehend/kniend, 30/30, 90/90 min) und in 0.21
            #   (Teil 0 S. 85); eine andere Reihenfolge nennt die SpO nicht. 90 Min. = 5400 s.
            # Zehnerserien: Ablage je 10 Schuss (0.11.5.2) und 0.12.1 (Teil 0 S. 43).
            # Probe/Vorbereitung regelt die SpO für 5.20 nicht (wie 5.10, siehe armbrust-10m.yaml); Felder leer.
            serien: 3
            schuss_je_serie: 10
            wettkampfzeit_s: 5400
            positionen:
              - { nr: 1, anschlaege: [{ haltung: "stehend" }] }
              - { nr: 2, anschlaege: [{ haltung: "stehend" }] }
              - { nr: 3, anschlaege: [{ haltung: "stehend" }] }
          - id: "kniend"
            name: "Kniend"
            # Ab Herren II/Damen II darf kniend auch sitzend geschossen werden (Teil 5 Allgemeine Regeln, S. 1).
            # Umbauzeit 30 Min. davor (Tabelle S. 17); dafür hat das Format kein Feld (siehe Beschreibung).
            serien: 3
            schuss_je_serie: 10
            wettkampfzeit_s: 5400
            positionen:
              - { nr: 4, anschlaege: [{ haltung: "kniend" }, { haltung: "sitzend" }] }
              - { nr: 5, anschlaege: [{ haltung: "kniend" }, { haltung: "sitzend" }] }
              - { nr: 6, anschlaege: [{ haltung: "kniend" }, { haltung: "sitzend" }] }
disziplinen:
  - kennziffer: "5.20"
    name: "Armbrust 30 m international"
    waffe: "30-m-Armbrust mit Bolzenführungsbahn und Schlitten, Schäftung beliebig mit Schaftkappe/Haken (5.8, 1.4.6); Gewicht frei, Sehnenlänge ≤608 (+ 3 %) laut Tabelle S. 17, ohne Einheit"
    munition: "Bolzen 6,0 mm (Toleranz +0/−0,05 mm)"
    visierung: "beliebig aus zwei Zielmitteln, Korntunnel max. 50 mm, Visierlinie max. 760 mm, Wasserwaage erlaubt"
    anschlag: "30 stehend (Handstütze erlaubt), 30 kniend (zwei Kissen oder Kissen und Kniendrolle)"
    scheibe: "DSB-Scheibe Nr. 16 (Armbrust international 30 m)"
    ablauf: "armbrust-30m-2x30"
    # Zweite Prüfung 2026-11-25: Spalte Gewicht/Sehnenlänge für 5.20/5.31 (gemeinsame Zelle): "≤608 (+ 3 %)" und "Frei";
    #   ≤608 ist die Sehnenlänge (wie ≤660 mm bei 5.32), Einheit fehlt, daher pruefen "waffe".
    #   pruefen "ablauf" entfernt: Reihenfolge laut beiden Tabellen; Probe/Vorbereitung regelt die SpO nicht.
    hinweis: "Umbauzeit zwischen den Anschlägen 30 Min. Kniend ab Herren II/Damen II auch sitzend erlaubt. Handstütze im Stehendanschlag erlaubt (5.8). Bis zu zwei Windbeobachtungsgeräte (5.6). Visierhilfe/optische Zielhilfsmittel ab Damen II/Herren II frei (Tabelle Teil 5 S. 17). Probe und Vorbereitung regelt die SpO nicht."
    pruefen: ["waffe"]
