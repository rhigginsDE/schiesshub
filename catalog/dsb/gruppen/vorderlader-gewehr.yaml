# Vorderlader Gewehr (Kugel) – DSB-Disziplinen
# Pflege: siehe catalog/README.md. Nur Fakten eintragen, keine Regeltexte kopieren.
# Quelle: DSB-Sportordnung, Stand 01.01.2027 (Gesamt-PDF), Teil 7: 7.1–7.7 und Vorderladertabelle (Teil 7 S. 12);
#   Teil 0: 0.1.1 (S. 1), 0.2 (S. 4), 0.4.3.2 (S. 12), 0.12.1 (S. 43), Scheiben 0.20 (S. 62, 65, 66), Wettbewerbe 0.21
#   (S. 88–89); Teil 9: 9.2–9.4.1 (S. 1–2) und Auflagetabelle (S. 8) für 7.11.
# Änderungen 2026→2027 in Teil 7: keine (Synopse 01.01.2027 ohne Teil-7-Eintrag). Seit 01.01.2026 heißt 7.11 in 0.21
#   „… – Auflage“ (Synopse 2026).
# geprüft 2026-11-22: Lauflänge min. 40 cm bei allen Disziplinen ergänzt (0.21, Teil 0 S. 88–89).
# geprüft 2026-11-25 (2. Prüfung): alle Werte gegen SpO 2027 abgeglichen; DM-Angaben aus den Hinweisen entfernt
#   (keine SpO-Quelle, gehören in startrecht.yaml); Mindestalter nach 0.2 je Laufart; 7.32 Scheibe Nr. 6; 7.11 Zeit geklärt.
schema: 1
verband: "dsb"
gruppe:
  id: "vorderlader-gewehr"
  name: "Vorderlader Gewehr"
  waffenart: "langwaffe"
  art: "praezision"
wertung:
  modell: "ringe"
  rangfolge: "absteigend"
  # SpO 7.7.5.1 (Teil 7 S. 8): zuerst Anzahl 10er, dann 9er, 8er usw.; dann geringste Abweichung des am weitesten vom
  # Zentrum liegenden Schusses. Mannschaft: dieselben Kriterien über alle Schüsse der Mannschaft (Format: Formatbedarf).
  gleichstand: ["zehner", "neuner_abwaerts", "geringste_abweichung_aeusserster_schuss"]
  # Ganze Ringe; maßgeblich ist die Einschussmitte auf der Ringlinie (SpO 7.7.5). Keine Zehntel: 9.4 nennt die
  # Zehntel-Wettbewerbe abschließend, 7.11 gehört nicht dazu.
  zehntelwertung: false
  # SpO 0.12.1 Satz 1 (Teil 0 S. 43): Vorderlader ist ausdrücklich ausgenommen, auch Höchstergebnisse werden unterschieden.
  hoechstergebnis_gleicher_rang: false
  # 2. Prüfung 2026-11-25: false, weil (1) bei 7.11 offen ist, ob 7.7.5.1 oder 9.4.1 den Gleichstand regelt (eine
  # Gruppe hat nur eine Gleichstandskette), und (2) bei 7.32 Scheibe und Ringwerte widersprüchlich sind (0.21 vs. 0.20).
  geprueft: false
ablaeufe:
  kugel-15:
    beschreibung: "15 Schuss in 40 Min.; vorher 10 Min. Vorbereitung mit unbegrenzter Probe"
    varianten:
      - id: "standard"
        name: "Standard"
        abschnitte:
          - id: "wertung"
            name: "Wertung"
            # 15 Wertungsschüsse, alle zählen (SpO 7.7.5; 0.21). 3×5 nach den 5er-Serien, die der Ergebnisausdruck bei
            # Vorderlader ausweist (SpO 0.4.3.2, Teil 0 S. 12). Pause zwischen Vorbereitung und Wertung bis 5 Min.,
            # mit Zuganlage/elektronisch 1 Min. (7.7.2) – im Format nicht abbildbar.
            serien: 3
            schuss_je_serie: 5
            vorbereitung_probe_s: 600     # 10 Min. = 600 s, SpO 7.7.1 (Teil 7 S. 6)
            probeschuesse: "unbegrenzt"   # nur in der Vorbereitungszeit, SpO 7.7.1
            wettkampfzeit_s: 2400         # 40 Min. = 2400 s, SpO 7.7.3 (Teil 7 S. 6); 0.21
  kugel-15-muskete:
    beschreibung: "15 Schuss in 40 Min. auf Scheibe Nr. 6 (Ringe 5–10); vorher 10 Min. Vorbereitung mit unbegrenzter Probe"
    varianten:
      - id: "standard"
        name: "Standard"
        abschnitte:
          - id: "wertung"
            name: "Wertung"
            serien: 3                     # wie kugel-15 (0.4.3.2)
            schuss_je_serie: 5
            ringwerte: [10, 9, 8, 7, 6, 5, 0]   # Scheibe Nr. 6, Ringe 5–10 (SpO 0.20, Teil 0 S. 62, 66)
            vorbereitung_probe_s: 600     # SpO 7.7.1
            probeschuesse: "unbegrenzt"   # SpO 7.7.1
            wettkampfzeit_s: 2400         # SpO 7.7.3
  auflage-15:
    # 7.11 richtet sich nach Teil 9: 0.21 verweist bei 7.11 auf „Tabelle Teil 9“ (statt Vorderladertabelle), die
    # Vorderladertabelle führt 7.11 nicht, und Teil 0 gilt nur, soweit der Fachteil nichts regelt (0.1.1). In Teil 9 nennt
    # die Zeile 7.11 der Auflagetabelle (S. 8) 15 Schuss und 55 bzw. 45 Min. inkl. Probe; sie geht als Einzelregel den
    # allgemeinen Sätzen 9.2 (30 Schuss) und 9.3 (50 m: 55/50 Min.) vor – die Schusszahl 15 bestätigt 0.21.
    beschreibung: "15 Schuss aufgelegt; 55 Min. inkl. Probe (Zuganlage) bzw. 45 Min. inkl. Probe (andere Systeme)"
    varianten:
      - id: "zuganlage"
        name: "Zuganlage"
        abschnitte:
          - id: "wertung"
            name: "Wertung"
            serien: 3
            schuss_je_serie: 5
            probeschuesse: "unbegrenzt"   # vor dem ersten Wertungsschuss, innerhalb der Schießzeit (SpO 9.2)
            wettkampfzeit_s: 3300         # 55 Min. = 3300 s inkl. Probe, Auflagetabelle (Teil 9 S. 8)
            positionen:
              - { nr: 1, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
              - { nr: 2, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
              - { nr: 3, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
      - id: "andere-systeme"
        name: "Andere Systeme (z. B. elektronisch)"
        abschnitte:
          - id: "wertung"
            name: "Wertung"
            serien: 3
            schuss_je_serie: 5
            probeschuesse: "unbegrenzt"   # SpO 9.2
            wettkampfzeit_s: 2700         # 45 Min. = 2700 s inkl. Probe, Auflagetabelle (Teil 9 S. 8)
            positionen:
              - { nr: 1, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
              - { nr: 2, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
              - { nr: 3, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
disziplinen:
  - kennziffer: "7.10"
    name: "Perkussionsgewehr"
    waffe: "Perkussions-Scheiben- oder Jagdgewehr (Original oder Replika); Lauflänge min. 40 cm"
    munition: "Kaliber beliebig; Schwarzpulver nach Richtsatz (0,25 g je mm Laufinnendurchmesser); Geschoss beliebig (Blei)"
    visierung: "Kimme (V/U, höhenverstellbar) und Korn (Dach/Perl/Blatt/Buckel, verstellbar) oder originalgetreuer Diopter"
    anschlag: "stehend frei"
    scheibe: "DSB-Scheibe Nr. 4 (Gewehr 100 m / Vorderlader)"
    ablauf: "kugel-15"
    hinweis: "50 m; Stecher erlaubt; Handstütze bis 200 mm; Wasserwaage/Pendel nicht funktionsfähig (SpO 7.4.2.2.3). Mindestalter (SpO 0.2): gezogener Lauf ab 18; glatter Lauf bis Kal. 12 ab 14."
  - kennziffer: "7.11"
    name: "Perkussionsgewehr – Auflage"
    waffe: "Perkussionsgewehr (Original oder Replika); Lauflänge min. 40 cm"
    munition: "Kaliber beliebig; Schwarzpulver; Geschoss zur Waffe gehörend"
    # geprüft 2026-11-22: visierung korrigiert. "dem Original entsprechend" ist in der Auflagetabelle (Teil 9 S. 8) die Spalte
    #   Schäftung; Spalte Visierhilfe/opt. Zielhilfsmittel: "keine". Form der Visierung nach 7.4.2.2.
    # 2. Prüfung 2026-11-25: Zeit geklärt (siehe Ablauf auflage-15), Anschlag laut Auflagetabelle eindeutig.
    #   "7/8" in der Spalte "Max. Schusszahl pro Scheibe" lässt sich als 15 = 7 + 8 Schuss auf zwei Papierscheiben lesen;
    #   kein Katalogwert hängt davon ab.
    #   Offen bleibt der Gleichstand: 7.7.5.1 (Vorderlader-Kugelwettbewerbe) oder 9.4.1 (Auflage, Plätze 1–6). Die SpO
    #   regelt den Vorrang nicht; 9.4.1 Nr. 1 (Zehnerserien) und Nr. 4 (Zehntel) passen nicht zu 15 Schuss ohne Zehntel.
    visierung: "wie Original (7.4.2.2); keine Visierhilfe, kein optisches Zielhilfsmittel"
    anschlag: "stehend aufgelegt (Kl. 70–73) bzw. auch sitzend aufgelegt (Kl. 74–81)"
    scheibe: "DSB-Scheibe Nr. 4 (Gewehr 100 m / Vorderlader)"
    ablauf: "auflage-15"
    hinweis: "50 m; Regeln nach Teil 9 (Auflage). Schäftung dem Original entsprechend, Auflagepunkt max. 550 mm von der Systemeinbettung, Laufbeschwerung nicht erlaubt (Teil 9 S. 8). Kennzahl seit 01.01.2026 mit Zusatz „Auflage“."
    pruefen: ["gleichstand"]
  - kennziffer: "7.15"
    name: "Perkussionsfreigewehr 100 m"
    waffe: "Perkussions-Scheiben- oder Jagdgewehr (Original oder Replika); Lauflänge min. 40 cm"
    munition: "Kaliber beliebig; Schwarzpulver nach Richtsatz; Geschoss beliebig (Blei)"
    visierung: "Korn original oder Korntunnel/Ring-/Balkenkorn, verstellbar; Kimme wie Original oder originalgetreuer Diopter"
    anschlag: "liegend"
    scheibe: "DSB-Scheibe Nr. 4 (Gewehr 100 m / Vorderlader)"
    ablauf: "kugel-15"
    hinweis: "100 m; Stecher erlaubt; Wasserwaage oder Pendel erlaubt; Riemen erlaubt (SpO 7.4.2.1). Mindestalter (SpO 0.2): gezogener Lauf ab 18; glatter Lauf bis Kal. 12 ab 14."
  - kennziffer: "7.16"
    name: "Perkussionsfreigewehr 300 m"
    waffe: "Perkussions-Scheiben- oder Jagdgewehr (Original oder Replika); Lauflänge min. 40 cm"
    munition: "Kaliber beliebig; Schwarzpulver nach Richtsatz; Geschoss beliebig (Blei)"
    visierung: "wie 7.15"
    anschlag: "liegend"
    scheibe: "DSB-Scheibe Nr. 5 (Gewehr 300 m / Vorderladerfreigewehr 300 m)"
    ablauf: "kugel-15"
    hinweis: "300 m; Stecher erlaubt; Wasserwaage oder Pendel erlaubt; Riemen erlaubt (SpO 7.4.2.1). Mindestalter (SpO 0.2): gezogener Lauf ab 18; glatter Lauf bis Kal. 12 ab 14."   # geprüft 2026-11-22: Stecher/Riemen ergänzt (Vorderladertabelle, 7.4.2.1)
  - kennziffer: "7.20"
    name: "Perkussionsdienstgewehr 100 m"
    waffe: "Perkussions-Dienstgewehr (Original oder Replika); Lauflänge min. 40 cm"
    munition: "mind. 13,5 mm; Schwarzpulver; zur Waffe gehörendes Geschoss (z. B. Minié)"
    visierung: "Kimme und Korn wie Original; Korn fest (nur mit Werkzeug verstellbar), Kimme höhenverstellbar; kein Diopter"
    anschlag: "liegend"
    scheibe: "DSB-Scheibe Nr. 4 (Gewehr 100 m / Vorderlader)"
    ablauf: "kugel-15"
    hinweis: "100 m; kein Stecher; Laderohr nur als Trichter bis 100 mm Gesamthöhe (SpO 7.7.4); Riemen erlaubt (7.4.2.1). Mindestalter (SpO 0.2): gezogener Lauf ab 18; glatter Lauf bis Kal. 12 ab 14."
  - kennziffer: "7.21"
    name: "Perkussionsdienstgewehr 50 m"
    waffe: "Perkussions-Dienstgewehr (Original oder Replika); Lauflänge min. 40 cm"
    munition: "mind. 13,5 mm; Schwarzpulver; zur Waffe gehörendes Geschoss (z. B. Minié)"
    visierung: "Kimme und Korn wie Original; Korn fest, Kimme höhenverstellbar; kein Diopter"
    anschlag: "stehend frei"
    scheibe: "DSB-Scheibe Nr. 4 (Gewehr 100 m / Vorderlader)"
    ablauf: "kugel-15"
    hinweis: "50 m; kein Stecher; Laderohr nur als Trichter bis 100 mm (SpO 7.7.4). Mindestalter (SpO 0.2): gezogener Lauf ab 18; glatter Lauf bis Kal. 12 ab 14."
  - kennziffer: "7.30"
    name: "Steinschlossgewehr"
    waffe: "Steinschlossgewehr (Original oder Replika); Lauflänge min. 40 cm"
    munition: "Kaliber beliebig; Schwarzpulver nach Richtsatz; Rundkugel"
    visierung: "Kimme wie Original, höhenverstellbar; Korn (Dach/Perl/Blatt/Buckel) fest, Korntunnel laufbündig erlaubt; originalgetreuer Diopter"
    anschlag: "stehend frei"
    scheibe: "DSB-Scheibe Nr. 4 (Gewehr 100 m / Vorderlader)"
    ablauf: "kugel-15"
    hinweis: "50 m; Stecher erlaubt; undurchlässige Seitenblenden Pflicht (SpO 7.3). Mindestalter (SpO 0.2): gezogener Lauf ab 18; glatter Lauf bis Kal. 12 ab 14."
  - kennziffer: "7.31"
    name: "Steinschlossgewehr liegend 100 m"
    waffe: "Steinschlossgewehr (Original oder Replika); Lauflänge min. 40 cm"
    munition: "Kaliber beliebig; Schwarzpulver nach Richtsatz; Rundkugel"
    visierung: "Kimme wie Original, verstellbar; Korn (Dach/Perl/Blatt/Buckel) fest; originalgetreuer Diopter"
    anschlag: "liegend"
    scheibe: "DSB-Scheibe Nr. 4 (Gewehr 100 m / Vorderlader)"
    ablauf: "kugel-15"
    hinweis: "100 m; Stecher erlaubt; Riemen erlaubt (SpO 7.4.2.1); undurchlässige Seitenblenden Pflicht (SpO 7.3). Mindestalter (SpO 0.2): gezogener Lauf ab 18; glatter Lauf bis Kal. 12 ab 14."
  - kennziffer: "7.32"
    name: "Luntenschlossgewehr"
    waffe: "Luntenschlossgewehr mit glattem Lauf (Original oder Replika); Lauflänge min. 40 cm"
    munition: "Kaliber beliebig; Schwarzpulver nach Richtsatz; Rundkugel"
    visierung: "Kimme und Korn originalgetreu, fest (japanische Visierungen, u. a. Lochkimme; Rechteckkimme zulässig, 7.4.2.2.2); kein Diopter"
    anschlag: "stehend frei"
    # 2. Prüfung 2026-11-25: Scheibe Nr. 4 → Nr. 6, Ablauf kugel-15 → kugel-15-muskete (Ringe 5–10). Die Scheibenblätter in
    #   0.20 nehmen das Luntenschlossgewehr bei Nr. 4 ausdrücklich aus (Teil 0 S. 65) und führen es bei Nr. 6 neben der
    #   Muskete auf (Teil 0 S. 66). 0.21 (Teil 0 S. 89) nennt dagegen Nr. 4. Widerspruch innerhalb der SpO, daher bleiben
    #   Scheibe und die davon abhängigen Ringwerte (Ablauf) zu prüfen.
    scheibe: "DSB-Scheibe Nr. 6 (Muskete/Luntenschlossgewehr 50 m, Ringe 5–10); 0.21 nennt Nr. 4"
    ablauf: "kugel-15-muskete"
    hinweis: "50 m; Stecher originalgetreu; undurchlässige Seitenblenden Pflicht (SpO 7.3); glimmende Lunte gegen Wegfliegen sichern (7.7.4.2). Mindestalter (SpO 0.2): glatter Lauf bis Kal. 12 ab 14, sonst ab 18."
    pruefen: ["scheibe", "ablauf"]
  - kennziffer: "7.35"
    name: "Muskete"
    waffe: "militärische Steinschlossmuskete mit glattem Lauf (Original oder Replika); Lauflänge min. 40 cm"
    munition: "mind. 16,5 mm; Schwarzpulver nach Richtsatz; Rundkugel"
    visierung: "nur Korn wie Original, fest; keine Kimme (Musketen mit fester Kimme nicht zugelassen, 7.4.2.2.2)"
    anschlag: "stehend frei"
    scheibe: "DSB-Scheibe Nr. 6 (Muskete 50 m, Ringe 5–10)"
    ablauf: "kugel-15-muskete"
    # geprüft 2026-11-22: "Ab 18 Jahren" entfernt (0.2 Nr. 2 oder Nr. 3).
    # 2. Prüfung 2026-11-25: Mindestalter hängt nach 0.2 Nr. 2/3 vom Kaliber ab (glatter Einzellader bis Kal. 12 ab 14,
    #   sonst ab 18); so als Hinweis eingetragen. Der Tabellenverweis "7.0.4.6.5.1" meint 7.4.2.2.2 (Kimmen bei Musketen).
    hinweis: "50 m; kein Stecher; Riemen erlaubt (7.4.2.1); Laderohr nur als Trichter bis 100 mm (7.7.4); undurchlässige Seitenblenden Pflicht (SpO 7.3). Mindestalter (SpO 0.2): glatter Lauf bis Kal. 12 ab 14, sonst ab 18."
