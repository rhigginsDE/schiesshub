# Gewehr 100 m (ein Anschlag) – DSB-Disziplinen (ENTWURF)
# Pflege: siehe catalog/README.md. Nur Fakten eintragen, keine Regeltexte kopieren.
# Quelle: DSB-Sportordnung, Stand 01.01.2027 (Blätterkatalog, abgerufen 2026-11-22): Teil 1: 1.1.1, 1.1.2, 1.4.6,
#   Wettbewerbstabelle (Teil 1 S. 19), Schusszahlen/Schießzeiten (Teil 1 S. 21); Teil 0: 0.21 (Teil 0 S. 76, 79, 80),
#   Scheibe Nr. 4 (100 m Gewehr, Teil 0 S. 65), 0.12.1. DM: 1.35 mit 30 Schuss, ganze Ringe (DSB-Schusszahlentabelle).
# 1.92, 1.97 nur in 0.21 ("entsprechend Ausschreibung"), nicht in der DM-Tabelle; Vorbereitungszeit dort nicht geregelt.
# 1.38 GK 100 m Feuerstutzen (0.21: "15–30" Schuss, BY: Feuerstutzen traditionell) fehlt absichtlich (siehe Notiz).
# Änderungen 2026→2027: 1.4.6 Hinweis (Ausrüstung); sonst keine.
