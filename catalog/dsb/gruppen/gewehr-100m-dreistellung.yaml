    anschlag: "kniend (ab Herren II/Damen II auch sitzend, 1.6) – liegend – stehend"
    scheibe: "DSB-Scheibe Nr. 4 (100 m Gewehr)"
    ablauf: "gk-3x40"
    hinweis: "Nur in 0.21 geregelt, Einzelheiten laut Ausschreibung. Nicht in der DM-Tabelle 2025–2028."
