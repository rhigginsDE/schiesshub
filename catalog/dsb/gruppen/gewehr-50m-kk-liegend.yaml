# Gewehr 50 m KK-Liegendkampf – DSB-Disziplinen (ENTWURF)
# Pflege: siehe catalog/README.md. Nur Fakten eintragen, keine Regeltexte kopieren.
# Quelle: DSB-Sportordnung, Stand 01.01.2027 (Blätterkatalog, abgerufen 2026-11-22): Teil 1: 1.1.1 (liegend),
#   Wettbewerbstabelle (Teil 1 S. 20), Schusszahlen/Schießzeiten (Teil 1 S. 21); Teil 0: 0.21 (Teil 0 S. 79), Scheibe Nr. 3,
#   0.12.1; Teil 15: Finale 50 m Gewehr liegend (Teil 15 S. 15–17).
#   Zehntelwertung auf LM und DM: DSB-Schusszahlentabelle (Ausschreibung DM, Stand 20.11.2025); die SpO selbst schreibt
#   für 1.80 keine Zehntel vor. Die Tabelle nennt für 1.80 keine Finalklassen; das Finale nach Teil 15 ist deshalb
#   nicht als Regelfall eingetragen (siehe Notiz).
# Teil 10 (Para, 10.10): "Im Nicht-Para-Bereich vom Boden oder Pritsche" (Anmerkung zu 1.80).
# Änderungen 2026→2027: keine an Schusszahl/Zeit (Synopse betrifft nur die Para-Tabelle Teil 10).
