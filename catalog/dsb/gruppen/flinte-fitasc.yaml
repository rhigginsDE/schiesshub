# Flinte FITASC-Disziplinen (Compak-Sporting, Parcours, Universaltrap) – DSB-Disziplinen
# Pflege: siehe catalog/README.md. Nur Fakten eintragen, keine Regeltexte kopieren.
# Quelle: DSB-Sportordnung, Stand 01.01.2027, Teil 3: 3.21–3.29 (allgemein FITASC), 3.30 Compak-Sporting,
#   3.35 Parcours, 3.40 Universaltrap, 3.45 Abweichungen ISSF/FITASC (Teil 3 S. 33–65); Teil 0 Wettbewerbstabelle
#   (Teil 0 S. 83/84); FITASC-Klassen Teil 0, 0.7.1 (Teil 0 S. 21). DM-Klassen: Tabelle DM 2025–2028 ("DM Flinte nach FITASC").
# Änderungen 2026→2027: Synopse nennt für Teil 3 keine Änderungen.
# FORMAT: gruppe.art "wurfscheibe" neu (siehe Notiz). Treffer als Ringwerte [1, 0].
#   Einzelscheibe: 2 Schuss erlaubt (3.22.1); Doublette: je Scheibe 1 Schuss (3.30.1.5). Die Schusszahl je Serie hängt
#   vom Layout ab und wird deshalb nicht eingetragen (nur ziele_je_serie).
# Teil 0 gegen Teil 3 (geprüft 2026-11-25, zweite Prüfung):
#   - Scheibenzahl: 0.21 (Teil 0 S. 83/84) nennt für 3.30, 3.35, 3.40 "75, 125". Teil 3 nennt für Compak keine
#     Gesamtzahl, für Parcours national 200 (3.35.3.3, Jury darf die Zahl ändern), für Universaltrap national 125 (3.40).
#     Beides steht in der SpO 2027, deshalb beide als Varianten: Fachteil-Wert zuerst, Teil-0-Werte daneben.
#   - Schrot: 0.21 nennt 24,5 g und 12/70; Teil 3 nennt 28,5 g und 1,9–2,6 mm (3.21.2) und grenzt das in 3.45.4
#     ausdrücklich von ISSF (24,5 g) ab. 0.21 verweist in der Spalte "Beschreibung" auf den Flintenteil. Es gilt 28,5 g.
schema: 1
verband: "dsb"
gruppe:
  id: "flinte-fitasc"
  name: "Flinte FITASC (Compak-Sporting, Parcours, Universaltrap)"
  waffenart: "flinte"
  art: "wurfscheibe"
wertung:
  modell: "ringe"
  rangfolge: "absteigend"
  # SpO 3.29.1.1 (Teil 3 S. 42): Platz 1–3 Stechen (3.29.1.2: erst eine 25er-Runde, dann KO, Doublette als Kombination);
  #   ab Platz 4 besserer letzter Durchgang, dann rückwärts. Kein Finale.
  gleichstand: ["stechen", "letzte_serie_rueckwaerts"]
  stechen_bis_platz: 3
  geprueft: true   # geprüft 2026-11-25 gegen SpO 2027 Teil 0 (0.20, 0.21), Teil 3 (3.21–3.45); zweite Prüfung
ablaeufe:
  compak-sporting:
    beschreibung: "Compak-Sporting: Durchgänge zu je 25 Wurfscheiben (5 Stände × 5); Gesamtzahl laut Teil 0: 75 oder 125"
    varianten:
      - id: "75"
        name: "75 Scheiben"
        abschnitte:
          - id: "wettkampf"
            name: "Wettkampf"
            serien: 3                 # 0.21 (Teil 0 S. 83): "75, 125"; Durchgang 25 WS (3.30.2, Teil 3 S. 45)
            ziele_je_serie: 25
            ringwerte: [1, 0]
      - id: "125"
        name: "125 Scheiben"
        abschnitte:
          - id: "wettkampf"
            name: "Wettkampf"
            serien: 5                 # 0.21 (Teil 0 S. 83)
            ziele_je_serie: 25
            ringwerte: [1, 0]
  parcours:
    beschreibung: "Parcours: national 200 Wurfscheiben in 8 Durchgängen zu je 25 (je Durchgang 15 Einzelscheiben, 5 Doubletten); Teil 0 nennt 75 oder 125"
    varianten:
      - id: "national"
        name: "Nationaler Wettbewerb (200 Scheiben)"
        abschnitte:
          - id: "wettkampf"
            name: "Wettkampf"
            serien: 8                 # SpO 3.35.3.3 (Teil 3 S. 59); Jury kann die Zahl ändern
            ziele_je_serie: 25        # 15 Einzelscheiben + 5 Doubletten (3.35.1.3, Teil 3 S. 54)
            ringwerte: [1, 0]
      # geprüft 2026-11-25: ergänzt, 0.21 (Teil 0 S. 84) nennt "75, 125"; 3.35.3.3 lässt eine andere Zahl durch die Jury zu
      - id: "75"
        name: "75 Scheiben (laut Teil 0)"
        abschnitte:
          - id: "wettkampf"
            name: "Wettkampf"
            serien: 3
            ziele_je_serie: 25
            ringwerte: [1, 0]
      - id: "125"
        name: "125 Scheiben (laut Teil 0)"
        abschnitte:
          - id: "wettkampf"
            name: "Wettkampf"
            serien: 5
            ziele_je_serie: 25
            ringwerte: [1, 0]
  universaltrap:
    beschreibung: "Universaltrap: national 125 Wurfscheiben in 5 Serien zu je 25 (5 Positionen × 5 Maschinen), bis zu 2 Schuss je Scheibe; Teil 0 nennt auch 75"
    varianten:
      - id: "national"
        name: "Nationaler Wettkampf (125 Scheiben)"
        abschnitte:
          - id: "wettkampf"
            name: "Wettkampf"
            serien: 5                 # SpO 3.40 (Einleitung), 3.40.2 (Teil 3 S. 60/61)
            ziele_je_serie: 25
            max_schuss_je_serie: 50   # 2 Schuss je Scheibe (3.40.2)
            ringwerte: [1, 0]
      # geprüft 2026-11-25: ergänzt, 0.21 (Teil 0 S. 84) nennt "75, 125"
      - id: "75"
        name: "75 Scheiben (laut Teil 0)"
        abschnitte:
          - id: "wettkampf"
            name: "Wettkampf"
            serien: 3
            ziele_je_serie: 25
            max_schuss_je_serie: 50
            ringwerte: [1, 0]
disziplinen:
  - kennziffer: "3.30"
    name: "Compak-Sporting"
    # geprüft 2026-11-25: Lauflänge (0.21, Teil 0 S. 83) und Gewehrriemen (3.21.1) ergänzt
    waffe: "Flinte bis Kaliber 12, auch halbautomatisch (Magazin max. 1 Patrone); Lauflänge min. 40 cm; keine Vorderschaft-/Unterhebelrepetierer, kein Release-Abzug, kein Leuchtpunkt, kein Gewehrriemen"
    munition: "Kal. 12; Schrotladung max. 28,5 g, kugelförmige Schrote 1,9–2,6 mm, keine gemischten Schrotgrößen (3.21.2, 3.45.4)"
    visierung: "Laufschiene/Korn"
    anschlag: "stehend; Anschlag bei Abruf frei, Schuss nur mit Waffe an der Schulter (3.30)"
    scheibe: "Wurfscheibe Nr. 11, dazu Mini, Midi, Battue, Rollhase (Sonderscheiben max. 40 %, 3.22, 3.30.3.6)"
    ablauf: "compak-sporting"
    # geprüft 2026-11-25: pruefen entfernt. Gesamtzahl 75/125 steht in 0.21 (Teil 3 nennt keine); Schrot 28,5 g nach 3.45.4.
    hinweis: "Je Stand 5 Scheiben nach einer von 5 Layout-Gruppen (3.30.2). KO-Stechen mit Layout-Gruppe 5 (3.30.3.3). Teil 0 nennt 24,5 g Schrot und 12/70, Teil 3 (3.21.2, 3.45.4) 28,5 g für FITASC."
  - kennziffer: "3.35"
    name: "Parcours (Jagdparcours, Sporting)"
    waffe: "wie 3.30"
    munition: "wie 3.30"
    visierung: "Laufschiene/Korn"
    anschlag: "stehend; Schaft bis zum Erscheinen der Scheibe unter der Markierung 25 cm unter der Schulterachse (3.35.1.6)"
    scheibe: "Wurfscheibe Nr. 11, dazu Mini, Midi, Segelscheibe, Rollhase, Flash-/Elektroscheiben (3.22)"
    ablauf: "parcours"
    # geprüft 2026-11-25: pruefen entfernt, Teil-0-Zahlen als eigene Varianten (siehe Ablauf)
    hinweis: "Teil 3 (3.35.3.3) nennt 200 Scheiben für nationale Wettbewerbe, Teil 0 (0.21) '75, 125'. Keine Ziel- oder Anschlagübungen (3.24.5)."
  - kennziffer: "3.40"
    name: "Universaltrap"
    waffe: "wie 3.30"
    munition: "wie 3.30"
    visierung: "Laufschiene/Korn"
    anschlag: "stehend"
    scheibe: "Standard-Wurfscheibe Nr. 11: 110 mm, 105 g ± 5 g (3.22, 0.20); 5 Maschinen, Schema 1–10"
    ablauf: "universaltrap"
    # geprüft 2026-11-22: 3.22 druckt "110 cm"; Scheibe Nr. 11 (Teil 0 0.20) nennt 110 mm ± 1 mm, daher 110 mm richtig.
    # geprüft 2026-11-25: pruefen entfernt (Schrot 28,5 g nach 3.45.4)
    hinweis: "Teil 3 (3.40) nennt 125 Scheiben für nationale Wettkämpfe, Teil 0 (0.21) '75, 125'. Durchmesser 110 mm laut Scheibe Nr. 11 (3.22 druckt versehentlich 110 cm)."
