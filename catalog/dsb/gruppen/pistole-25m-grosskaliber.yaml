# 25 m Pistole/Revolver Großkaliber – DSB-Disziplinen (2.53, 2.55, 2.58, 2.59; dazu 2.51, 2.52, 2.54, 2.56, 2.57)
# Pflege: siehe catalog/README.md. Nur Fakten eintragen, keine Regeltexte kopieren.
# Quelle: DSB-Sportordnung, Stand 01.01.2027 (Blätterkatalog, abgerufen 2026-11-22): Teil 2: 2.1.1 (Anschlag 2.50–2.59),
#   2.5.1, 2.5.2, 2.9 mit Tabelle Stech-/Probeserien (S. 11), 2.10.5, 2.21 (Wettbewerbe 2.53/2.59/2.55/2.58) inkl.
#   MIP-Tabelle und Durchgangstabelle (S. 20–22), Pistolentabelle (S. 23), Schießzeitentabelle (S. 25), S. 26
#   (Revolver: Patronenzuführung auf 12 Uhr); Teil 0: 0.12.1, 0.20 (Scheiben Nr. 4 und 10), 0.21 (S. 81–82).
#   Schusszahlen/Endkampf DM: Schusszahlentabelle der DM-Ausschreibung (Stand 21.01.2026); Klassen: DM-Tabelle 2025–2028.
# 2.51, 2.52, 2.54, 2.56, 2.57 stehen nur in der Wettbewerbstabelle 0.21 ("entsprechend Ausschreibung"), nicht in Teil 2
#   und nicht in der DM-Tabelle. Ablauf dort aus 0.21 (40 Schuss, 150 s / 20 s), Details nach Ausschreibung.
# Änderungen 2026→2027 (Synopse): 2.10.5 Kimme und Korn schwarz, bei GK (2.5x) weiße Punkte zulässig; keine
#   Leuchtstäbchen. 2.3.1/2.7.3 wie bei den übrigen 25-m-Wettbewerben. Keine Änderung an Schusszahlen oder Zeiten.
# geprüft 2026-11-22: Namen 2.53/2.55/2.58/2.59 auf die Schreibweise der Wettbewerbstabelle 0.21 gebracht; in den
#   Hinweisen 2.53–2.59 Verbot von Gasentlastung/Kompensatoren/Mündungsbremsen ergänzt (Pistolentabelle Teil 2 S. 23).
#   Zeiten, Schusszahlen, Scheiben, MIP-Werte (2.21.1), Endkampf (2.21.3–2.21.5) bestätigt.
# Zweite Prüfung 2026-11-25 (gegen SpO 2027): 2.53/2.55/2.58/2.59 vollständig bestätigt (Pistolentabelle Teil 2 S. 23
#   als Bild: Verbot Gasentlastung usw. gilt auch für die GK-Zeile; Scheibe Nr. 10 nennt "Pistole/Revolver (2.50)
#   20 Sek. Serie", Teil 0 S. 68). Visierung 2.51–2.57 aus 2.10.5 geklärt. Offen bleibt nur der Ablauf 2.51–2.57.
