# Auflage 100 m KK-Gewehr – DSB-Disziplinen
# Pflege: siehe catalog/README.md. Nur Fakten eintragen, keine Regeltexte kopieren.
# Quelle: DSB-Sportordnung, Stand 01.01.2027 (Blätterkatalog dsb.de/fileadmin/dsb/sportordnung/, abgerufen 2026-11-22),
#   Teil 9: 9.1–9.8 und Wettbewerbstabelle Auflagewettbewerbe (Teil 9 S. 8); Teil 0: Wettbewerbstabelle 0.21
#   (Teil 0 S. 76–77), Scheiben 0.20, Ergebnisgleichheit 0.12, Mannschaft 0.7.2.2.
# Anschlag: Kl. 70–73 (Senioren I–II) nur stehend aufgelegt; Kl. 74–81 (Senioren III–VI) stehend oder sitzend
#   aufgelegt auf Hocker ohne Lehne (9.7.6.1). Ganzer Wettkampf im gleichen Anschlag (9.7.6 Nr. 9).
#   Sitzend auch für Para-Sportschützen mit Hilfsmittelausweis bzw. Eintrag G/aG im Schwerbehindertenausweis (9.7.7).
# Änderungen 2026→2027 in Teil 9 (Synopse 01.01.2027): nur Ausrüstung (9.7.2 Schaftkappe, 9.7.3 Visierlinien-
#   rückverlagerung) und 9.8.3.1 (nichtzielender Arm keine Stütze); Schusszahl, Zeiten, Wertung unverändert.
schema: 1
verband: "dsb"
gruppe:
  id: "auflage-100m"
  name: "Auflage 100 m KK-Gewehr"
  waffenart: "langwaffe"
  distanz_m: 100
  art: "auflage"
wertung:
  modell: "ringe"
  rangfolge: "absteigend"
  # SpO 9.4 (Teil 9 S. 2): Zehntelwertung auf DM und Landesmeisterschaften u. a. in "100 m KK-Gewehr Auflage" (= 1.36,
  #   einzige 100-m-Zeile der Tabelle Teil 9 S. 8). Darunter gilt 0.11 ff. (ganze Ringe).
  zehntelwertung: true
  # SpO 9.4.1 (Zehntelwertung, Plätze 1–6; Teil 9 S. 2): Gesamtsumme in Zehnteln (= Ergebnis), dann letzte
  #   Zehnerserie in Zehnteln rückwärts vergleichend; danach gleicher Platz. 9.4.3 (Stechen bei 300) gilt nur
  #   bei voller Ringwertung. Bei ganzen Ringen (unterhalb LM) gilt die Kette der vollen Ringwertung aus 9.4.1;
  #   das Format kann die Kette nicht an die Zehntel-Einstellung koppeln (siehe Prüfbericht, Formatbedarf).
  gleichstand: ["letzte_serie_rueckwaerts"]
  # Nicht geprüft: 1.44 gehört zur Gruppe und erbt zehntelwertung. 9.4 und die Tabelle Teil 9 nennen 1.44 nicht,
  #   Zehntel für 1.44 ist also keine SpO-Vorgabe (Inhaberentscheidung). Alle anderen Werte belegt (2. Prüfung 2026-11-25).
  geprueft: false
ablaeufe:
  auflage-30-100m:
    beschreibung: "30 Schuss aufgelegt; 55 Min. (Zuganlage) bzw. 50 Min. (andere Systeme) inkl. Probe"
    # 30 Wertungsschüsse, Probe unbegrenzt vor dem ersten Wertungsschuss (9.2, Teil 9 S. 1); 55/50 Min. inkl. Probe
    #   = 3300/3000 s (9.3, Teil 9 S. 2; Tabelle Teil 9 S. 8; 0.21 Teil 0 S. 76–77 "55 / 50*"). Serien zu 10 Schuss:
    #   Ablage je Zehnerserie (0.11.5.2, Teil 0 S. 43), Vergleich nach Zehnerserien (9.4.1).
    varianten:
      - id: "zuganlage"
        name: "Zuganlage"
        abschnitte:
          - id: "wertung"
            name: "Wertung"
            serien: 3
            schuss_je_serie: 10
            probeschuesse: "unbegrenzt"   # SpO 9.2, nur vor dem ersten Wertungsschuss
            wettkampfzeit_s: 3300   # inkl. Probe (SpO 9.3)
            positionen:
              - { nr: 1, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
              - { nr: 2, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
              - { nr: 3, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
      - id: "andere-systeme"
        name: "Andere Systeme (z. B. elektronische Scheiben)"
        abschnitte:
          - id: "wertung"
            name: "Wertung"
            serien: 3
            schuss_je_serie: 10
            probeschuesse: "unbegrenzt"   # SpO 9.2, nur vor dem ersten Wertungsschuss
            wettkampfzeit_s: 3000   # inkl. Probe (SpO 9.3)
            positionen:
              - { nr: 1, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
              - { nr: 2, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
              - { nr: 3, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
    # Endkampf: Teil 15 S. 2–4 "Endkampfregeln für die Auflagewettbewerbe des DSB" (10 m / 50 m / 100 m Gewehr und
    #   10 m Luftpistole, Seniorinnen und Senioren). 8 Teilnehmer: Ausscheiden beginnt mit Platz 8 (Abschnitt i).
    #   Ob das Vorkampfergebnis übertragen wird, sagt der Abschnitt nicht; der Hinweis behauptet dazu nichts.
    #   Teil 9 schreibt keinen Endkampf vor. Die DM-Schusszahlentabelle (nicht SpO) sieht für 1.36 keinen vor.
    #   2. Prüfung 2026-11-25: DM-Angabe aus dem Hinweis entfernt (keine SpO-Quelle).
    finale:
      teilnehmer: 8
      abschnitt: "SpO Teil 15 S. 2–4 (Endkampfregeln Auflage)"
      hinweis: "Nur wenn die Ausschreibung einen Endkampf vorsieht; Teil 9 schreibt keinen vor. Zehntelwertung; 5 Min. Vorbereitung mit unbegrenzter Probe; 2×5 Schuss in je 250 s, dann 14 Einzelschüsse in je 50 s; nach dem 12. Schuss scheidet der Letzte aus, danach nach jedem zweiten Schuss; 24 Schuss; Gleichstand beim Ausscheiden durch Stechschüsse."
disziplinen:
  - kennziffer: "1.36"
    name: "KK Gewehr Auflage 100 m"
    waffe: "KK-Gewehr (Einzellader oder Mehrlader als Einzellader)"
    munition: "5,6 mm (.22 l.r./.22 lfb) Randzünder, keine Magnum"
    visierung: "Diopter/Korn oder Zielfernrohr bis 12-fach (unbeleuchtetes Absehen); im ganzen Wettkampf nur ein Zielmittel"
    anschlag: "stehend aufgelegt (Kl. 70–73); stehend oder sitzend aufgelegt (Kl. 74–81)"
    scheibe: "DSB-Scheibe Nr. 4 (100 m Gewehr)"
    ablauf: "auflage-30-100m"
    # Name, Waffenart, Lauflänge min. 40 cm, Visierung, Kaliber, Anschlag, 30 Schuss, 55/50*, Scheibe 4: 0.21
    #   (Teil 0 S. 76); Scheibe 4 = Gewehr 100 m (0.20, Teil 0 S. 62). Ausrüstung: Tabelle Teil 9 S. 8 mit
    #   Anm. * und **; Korntunnel über Mündung max. 50 mm (9.7.3).
    hinweis: "Zehntelwertung auf DM und LM (9.4). Max. 7500 g ohne, 8000 g mit Zielfernrohr; Abzug frei; Lauflänge mind. 40 cm; Auflagepunkt max. 550 mm ab Systemeinbettung, Auflagenbreite max. 60 mm; Laufbeschwerung max. 60 mm unter der Laufachse, nicht über die Mündung; Korntunnel max. 80 mm lang, Ø max. 25 mm, max. 50 mm über die Mündung; Kompensatoren/Rückstoßbremsen nicht erlaubt; ab DM max. 1 Schuss je Scheibe."
  - kennziffer: "1.44"
    name: "KK Gewehr 100 m Zielfernrohr aufgelegt"
    waffe: "KK-Gewehr (Einzellader oder Mehrlader als Einzellader)"
    munition: "5,6 mm (.22 l.r./.22 lfb)"
    visierung: "Zielfernrohr bis 12-fach"
    anschlag: "aufgelegt; stehend, ab Kl. 74 auch sitzend (9.7.6.1)"
    scheibe: "DSB-Scheibe Nr. 4 (100 m Gewehr)"
    ablauf: "auflage-30-100m"
    # 0.21 (Teil 0 S. 77): Name, Lauflänge min. 40 cm, ZF bis 12-fach, Kaliber, "aufgelegt", 30 Schuss, 55/50* Min.,
    #   Scheibe 4, Beschreibung "Tabelle Teil 9" (dort nicht geführt). 2. Prüfung 2026-11-25:
    #   - ablauf geklärt: 0.21 nennt 55/50* Min.; deckt sich mit 9.2/9.3 (30 Schuss, Probe unbegrenzt, inkl. Probe).
    #   - anschlag geklärt: 0.21 "aufgelegt"; sitzend ab Seniorenklasse III nach 9.7.6.1 (gilt für alle Auflage-Teilnehmer).
    #   - zehntelwertung offen: 9.4 nennt 1.44 nicht ausdrücklich, die Gruppe gibt Zehntel vor (Inhaberentscheidung).
    hinweis: "Nur in Teil 0 (0.21) gelistet (55 Min., 50 Min. bei elektronischen Anlagen); verweist auf die Tabelle Teil 9, steht dort aber nicht mehr. Lauflänge mind. 40 cm."
    optional: true   # laut Feldbedeutung: nicht in der DM-Tabelle 2025–2028
    pruefen: ["zehntelwertung"]
