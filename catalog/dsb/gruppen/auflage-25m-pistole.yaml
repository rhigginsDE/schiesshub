# Auflage 25 m Sportpistole – DSB-Disziplinen
# Pflege: siehe catalog/README.md. Nur Fakten eintragen, keine Regeltexte kopieren.
# Quelle: DSB-Sportordnung, Stand 01.01.2027 (Blätterkatalog dsb.de/fileadmin/dsb/sportordnung/, abgerufen 2026-11-22),
#   Teil 9: 9.1–9.8 und Wettbewerbstabelle Auflagewettbewerbe (Teil 9 S. 8); Teil 0: Wettbewerbstabelle 0.21
#   (Teil 0 S. 81), Scheiben 0.20, Ergebnisgleichheit 0.12, Mannschaft 0.7.2.2.
# Anschlag: Kl. 70–73 (Senioren I–II) nur stehend aufgelegt; Kl. 74–81 (Senioren III–VI) stehend oder sitzend
#   aufgelegt auf Hocker ohne Lehne (9.7.6.1). Ganzer Wettkampf im gleichen Anschlag (9.7.6 Nr. 9).
#   Sitzend auch für Para-Sportschützen mit Hilfsmittelausweis bzw. Eintrag G/aG im Schwerbehindertenausweis (9.7.7).
# Änderungen 2026→2027 in Teil 9 (Synopse 01.01.2027): nur Ausrüstung (9.7.2 Schaftkappe, 9.7.3 Visierlinien-
#   rückverlagerung) und 9.8.3.1 (nichtzielender Arm keine Stütze); Schusszahl, Zeiten, Wertung unverändert.
schema: 1
verband: "dsb"
gruppe:
  id: "auflage-25m-pistole"
  name: "Auflage 25 m Sportpistole"
  waffenart: "kurzwaffe"
  distanz_m: 25
  art: "auflage"
wertung:
  modell: "ringe"
  rangfolge: "absteigend"
  # Ganze Ringe: 9.4 nennt 2.42 nicht bei der Zehntelwertung, es gilt 0.11 ff. (Teil 9 S. 2; Teil 0 S. 39).
  # SpO 9.4.1 (volle Ringwertung, Plätze 1–6; Teil 9 S. 2): Zehnerserien von hinten, Anzahl 10er/9er/8er …,
  #   Innenzehner, Gesamtergebnis in Zehnteln; dann gleicher Rang. Die Wertung vergleicht 10-Schuss-Blöcke,
  #   je zwei 5er-Serien bilden einen Block. Ab Platz 7: 0.12.1 (Teil 0 S. 43) mit denselben drei ersten
  #   Kriterien; Nr. 4 dort nimmt Auflagewettbewerbe vom gleichen Rang aus, deshalb gilt die Kette für alle Plätze.
  # Mannschaft (9.4.2, Plätze 1–3): 9.4.1 sinngemäß auf die Summen.
  # Nicht abbildbar: Bei 300 Ringen entscheidet ein Stechen (9.4.3, Teil 9 S. 3: Zehntel, 5 Min. Probe,
  #   5 Schuss à 50 s, dann Einzelschüsse mit Ausscheiden). hoechstergebnis_gleicher_rang (0.12.1 Satz 1)
  #   gilt deshalb nicht und bleibt leer.
  gleichstand: ["letzte_serie_rueckwaerts", "zehner", "neuner_abwaerts", "innenzehner", "zehntel_gesamt"]
  # geprüft 2026-11-25 (2. Prüfung) gegen SpO 2027 Teil 9 S. 1–9, Teil 0 S. 43, 62, 81.
  geprueft: true
ablaeufe:
  praezision-6x5:
    beschreibung: "30 Schuss aufgelegt, nur Präzision: 6 Serien à 5 Schuss in je 150 s; vorher 1 Probeserie in 150 s"
    varianten:
      - id: "standard"
        name: "Standard"
        abschnitte:
          - id: "praezision"
            name: "Präzision"
            serien: 6
            schuss_je_serie: 5
            zeit_je_serie_s: 150   # 6×5 in je 150 s: SpO 9.3 (Teil 9 S. 2), Tabelle Teil 9 S. 8, 0.21 (Teil 0 S. 81)
            # 1 Probeserie in 150 s vor den Wertungsserien (SpO 9.2, Teil 9 S. 1); die Schusszahl der
            #   Probeserie nennt Teil 9 nicht, deshalb kein probeschuesse. Eine eigene Vorbereitungszeit nennt Teil 9 nicht.
            vorbereitung_probe_s: 150
            positionen:
              - { nr: 1, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
              - { nr: 2, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
              - { nr: 3, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
              - { nr: 4, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
              - { nr: 5, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
              - { nr: 6, anschlaege: [{ haltung: "stehend", aufgelegt: true }, { haltung: "sitzend", aufgelegt: true }] }
disziplinen:
  - kennziffer: "2.42"
    name: "25 m Sportpistole Auflage - Präzision"
    waffe: "Sportpistole (Mehrlader)"
    munition: "5,6 mm (.22 l.r./.22 lfb) Randzünder"
    visierung: "offen (Kimme/Korn), kein Zielhilfsmittel"
    anschlag: "stehend aufgelegt (Kl. 70–73); stehend oder sitzend aufgelegt (Kl. 74–81)"
    scheibe: "DSB-Scheibe Nr. 4 (25 m Pistole Präzision)"
    ablauf: "praezision-6x5"
    # Name, Waffenart (Kurzwaffe/Mehrlader), Lauflänge, Kaliber, Scheibe 4: 0.21 (Teil 0 S. 81); Scheibe 4 = 25 m Pistole
    #   (0.20, Teil 0 S. 62). Gewicht, Abzug, Prüfkasten, Munition, Anschlag, 1 Schuss je Scheibe, Auflage 50 mm am
    #   Griff: Tabelle Teil 9 S. 8. Zeichnung Teil 9 S. 9: Auflagefläche max. 40 mm lang, glatt, bis 10° geneigt;
    #   Breite laut Prüfkasten. Die Prüfkastentiefe ist 50 mm, das passt zu den 50 mm der Tabelle (2. Prüfung 2026-11-25).
    hinweis: "Kein Duellteil. Max. 1400 g; Abzug mind. 1000 g; Prüfkasten 300 × 150 × 50 mm; Lauflänge 10–15,3 cm; Auflagefläche unterhalb des Griffes: max. 40 mm lang (Vorderkante bis Fingerrille), max. 50 mm breit, glatt, bis 10° zur Laufachse geneigt (Teil 9 S. 8–9); max. 1 Schuss je Scheibe; Pistole darf vor dem Startkommando aufgelegt sein (9.8.3 Nr. 6); Störungen wie 25 m Standardpistole, nur 1 Wiederholung (9.8.4)."
