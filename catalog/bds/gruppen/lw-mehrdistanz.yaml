# LW Mehrdistanz – BDS-Disziplinen
# Pflege: siehe catalog/README.md. Nur Fakten eintragen, keine Regeltexte kopieren.
# Quelle: BDS-SHB Teil L, Fassung BVA-Genehmigungsbescheid vom 30.06.2026, L 12.01–L 12.11; optional 4821 laut Kommentar zu A 3.01.
# Varianten = Parcours-Varianten nach L 12.08/L 12.09 (Variante 1: Repetierer ohne Wechselmagazin, Variante 2: Büchsen mit Wechselmagazin).
# trefferaufnahme_nach: L 12.08 (Parcours nach der letzten Position). Fertigkeit fehlt absichtlich: Laut L 12.07 entscheidet der Veranstalter.
schema: 1
verband: "bds"
gruppe:
  id: "lw-mehrdistanz"
  name: "LW Mehrdistanz"
  waffenart: "langwaffe"
  art: "mehrdistanz"
wertung:
  modell: "ringe_mit_zeitabzug"
  rangfolge: "absteigend"
  abzug_je_voller_sekunde_ueber_sollzeit: 1
  min_teilergebnis: 0
  gleichstand: ["parcours_zeit"]
  geprueft: true
ablaeufe:
  mehrdistanz-30-bis-25m:
    beschreibung: "30 Schuss: Fertigkeit 15 m kniend / 20 m stehend / 25 m kniend, je 5 Schuss in 15 s; Parcours 25 m stehend / 20 m kniend / 15 m stehend, je 5 Schuss auf je eine eigene Scheibe, auf Zeit; Sollzeit 70 s (Variante 1) bzw. 50 s (Variante 2)"
    varianten:
      - id: "variante-1"
        name: "Parcours-Variante 1 (Repetierer ohne Wechselmagazin)"
        abschnitte:
          - id: "fertigkeit"
            name: "Fertigkeit"
            serien: 3
            schuss_je_serie: 5
            zeit_je_serie_s: 15
            distanzen_m: [15, 20, 25]
            positionen:
              - nr: 1
                distanz_m: 15
                anschlaege:
                  - { haltung: "kniend" }
              - nr: 2
                distanz_m: 20
                anschlaege:
                  - { haltung: "stehend" }
              - nr: 3
                distanz_m: 25
                anschlaege:
                  - { haltung: "kniend" }
          - id: "parcours"
            name: "Parcours"
            serien: 3
            trefferaufnahme_nach: [3]
            schuss_je_serie: 5
            distanzen_m: [25, 20, 15]
            positionen:
              - nr: 4
                distanz_m: 25
                anschlaege:
                  - { haltung: "stehend" }
                scheibe: 1
              - nr: 5
                distanz_m: 20
                anschlaege:
                  - { haltung: "kniend" }
                scheibe: 2
              - nr: 6
                distanz_m: 15
                anschlaege:
                  - { haltung: "stehend" }
                scheibe: 3
            zeit_wird_gemessen: true
            sollzeit_s: 70
            max_gesamtzeit_s: 140
      - id: "variante-2"
        name: "Parcours-Variante 2 (Büchse mit Wechselmagazin)"
        abschnitte:
          - id: "fertigkeit"
            name: "Fertigkeit"
            serien: 3
            schuss_je_serie: 5
            zeit_je_serie_s: 15
            distanzen_m: [15, 20, 25]
            positionen:
              - nr: 1
                distanz_m: 15
                anschlaege:
                  - { haltung: "kniend" }
              - nr: 2
                distanz_m: 20
                anschlaege:
                  - { haltung: "stehend" }
              - nr: 3
                distanz_m: 25
                anschlaege:
                  - { haltung: "kniend" }
          - id: "parcours"
            name: "Parcours"
            serien: 3
            trefferaufnahme_nach: [3]
            schuss_je_serie: 5
            distanzen_m: [25, 20, 15]
            positionen:
              - nr: 4
                distanz_m: 25
                anschlaege:
                  - { haltung: "stehend" }
                scheibe: 1
              - nr: 5
                distanz_m: 20
                anschlaege:
                  - { haltung: "kniend" }
                scheibe: 2
              - nr: 6
                distanz_m: 15
                anschlaege:
                  - { haltung: "stehend" }
                scheibe: 3
            zeit_wird_gemessen: true
            sollzeit_s: 50
            max_gesamtzeit_s: 100
