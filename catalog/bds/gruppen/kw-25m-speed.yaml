# KW 25 m Speed – BDS-Disziplinen
# Pflege: siehe catalog/README.md. Nur Fakten eintragen, keine Regeltexte kopieren.
# Quelle: BDS-SHB Teil K, Fassung BVA-Bescheid 30.06.2026, K 6.01–6.10 (S. K-25 bis K-27), Patronenlisten K 8;
# optionale Disziplinen K 1.19 / Kommentar zu A3.01
# ringwerte K 6.04; unbeendete_serie K 6.10.
schema: 1
verband: "bds"
gruppe:
  id: "kw-25m-speed"
  name: "KW 25 m Speed"
  waffenart: "kurzwaffe"
  distanz_m: 25
  art: "speed"
wertung:
