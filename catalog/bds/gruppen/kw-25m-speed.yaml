  zeit_rundung: "summe_abrunden"
  unbeendete_serie: "ringe_bis_dahin_zeit_letzter_schuss"
  geprueft: false
ablaeufe:
  speed-5-scheiben:
    beschreibung: "Je 1 Schuss pro Scheibe (10/7/0 Ringe); 4 Serien (20 Schuss) bzw. 6 (30, DM); max. 1 Min. je Serie; Ringe minus Summe der Sekunden (abgerundet)"
