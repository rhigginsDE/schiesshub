      - id: "bm-lm"
        name: "Bezirks-/Landesmeisterschaft"
        abschnitte:
          - id: "speed"
            name: "Speed"
            serien: 4
            schuss_je_serie: 5
            ziele_je_serie: 5
            max_zeit_je_serie_s: 60
            ringwerte: [10, 7, 0]
            zeit_wird_gemessen: true
      - id: "dm"
        name: "Deutsche Meisterschaft"
        abschnitte:
          - id: "speed"
            name: "Speed"
            serien: 6
            schuss_je_serie: 5
            ziele_je_serie: 5
            max_zeit_je_serie_s: 60
            ringwerte: [10, 7, 0]
            zeit_wird_gemessen: true
