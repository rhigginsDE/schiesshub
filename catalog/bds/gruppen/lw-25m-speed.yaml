# LW 25 m Speed – BDS-Disziplinen
# Pflege: siehe catalog/README.md. Nur Fakten eintragen, keine Regeltexte kopieren.
# Quelle: BDS-SHB Teil L, Fassung BVA-Genehmigungsbescheid vom 30.06.2026, L 9.01, L 9.03–L 9.09.
# Gleichstand: in L 9 nicht geregelt (A 9.03 betrifft Ringgleichheit), daher kein Eintrag.
# ringwerte L 9.04; unbeendete_serie L 9.09.
schema: 1
verband: "bds"
gruppe:
  id: "lw-25m-speed"
  name: "LW 25 m Speed"
  waffenart: "langwaffe"
  distanz_m: 25
  art: "speed"
wertung:
  modell: "ringe_minus_zeit"
  rangfolge: "absteigend"
  zeit_rundung: "summe_abrunden"
  unbeendete_serie: "ringe_bis_dahin_zeit_letzter_schuss"
  geprueft: false  # Gleichstandsregel für Speed in L 9 nicht geregelt; Anwendbarkeit A 9.03 offen
ablaeufe:
  speed-5er-serien:
    beschreibung: "BM/LM 20, DM 30 Schuss in 5er-Serien auf 5 Speed-Scheiben (je 1 Schuss, Reihenfolge links→rechts oder rechts→links); max. 1 Min. je Serie; Zeit per Timer"
    varianten:
      - id: "bm-lm"
        name: "Bezirks-/Landesmeisterschaft"
        abschnitte:
          - id: "speed"
            name: "Speed"
            serien: 4
            schuss_je_serie: 5
            ziele_je_serie: 5
            max_zeit_je_serie_s: 60
            ringwerte: [10, 7, 0]
            zeit_wird_gemessen: true
      - id: "dm"
        name: "Deutsche Meisterschaft"
        abschnitte:
          - id: "speed"
            name: "Speed"
            serien: 6
            schuss_je_serie: 5
            ziele_je_serie: 5
            max_zeit_je_serie_s: 60
            ringwerte: [10, 7, 0]
            zeit_wird_gemessen: true
