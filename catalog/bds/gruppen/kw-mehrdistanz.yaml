# KW Mehrdistanz – BDS-Disziplinen
# Pflege: siehe catalog/README.md. Nur Fakten eintragen, keine Regeltexte kopieren.
# Quelle: BDS-SHB Teil K, Fassung BVA-Bescheid 30.06.2026, K 4.01–4.09 (S. K-16 bis K-19), Patronenliste 1205 K 8;
