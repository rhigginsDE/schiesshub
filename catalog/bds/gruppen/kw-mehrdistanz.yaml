# KW Mehrdistanz – BDS-Disziplinen
# Pflege: siehe catalog/README.md. Nur Fakten eintragen, keine Regeltexte kopieren.
# Quelle: BDS-SHB Teil K, Fassung BVA-Bescheid 30.06.2026, K 4.01–4.09 (S. K-16 bis K-19), Patronenliste 1205 K 8;
# Gleichstand A 9.03; optionale Disziplinen Kommentar zu A3.01
# trefferaufnahme_nach: K 4.06 (nach Pos. 2 und 4), K 4.07 (nach Pos. 8).
schema: 1
verband: "bds"
gruppe:
  id: "kw-mehrdistanz"
  name: "KW Mehrdistanz"
  waffenart: "kurzwaffe"
  art: "mehrdistanz"
wertung:
  modell: "ringe_mit_zeitabzug"
  rangfolge: "absteigend"
  abzug_je_voller_sekunde_ueber_sollzeit: 1
  min_teilergebnis: 0
  gleichstand: ["zehner", "innenzehner", "neuner_abwaerts"]
  geprueft: true
# Abläufe je Waffe getrennt: Pistolen nur Variante 1 und 2-Pistole, Revolver nur Variante 1 und 2-Revolver (K 4.07/4.08);
# "Pistole oder Revolver" behält alle drei.
ablaeufe:
  mehrdistanz-40:
    beschreibung: "40 Schuss: Fertigkeit stehend, je 5 Schuss in 10 s – Pos. 1 5 m schwache Hand, Pos. 2 10 m starke Hand, Pos. 3 15 m beidhändig, Pos. 4 20 m beidhändig; Parcours auf Zeit, je 5 Schuss auf eine eigene Scheibe (1.–4. von links) – Pos. 5 20 m stehend beidhändig, Pos. 6 15 m kniend beidhändig oder stehend einhändig schwache Hand, Pos. 7 10 m stehend beidhändig, Pos. 8 5 m stehend einhändig; Sollzeit je Parcours-Variante (Pistole oder Revolver)"
    varianten:
      - id: "variante-1"
        name: "Parcours-Variante 1 (1 Magazin / ohne Ladehilfen)"
        abschnitte:
          - id: "fertigkeit"
            name: "Fertigkeit"
            serien: 4
            trefferaufnahme_nach: [2, 4]
            schuss_je_serie: 5
            zeit_je_serie_s: 10
            distanzen_m: [5, 10, 15, 20]
            positionen:
              - nr: 1
                distanz_m: 5
                anschlaege:
                  - { haltung: "stehend", hand: "schwache_hand" }
              - nr: 2
                distanz_m: 10
                anschlaege:
                  - { haltung: "stehend", hand: "starke_hand" }
              - nr: 3
                distanz_m: 15
                anschlaege:
                  - { haltung: "stehend", hand: "beidhaendig" }
              - nr: 4
                distanz_m: 20
                anschlaege:
                  - { haltung: "stehend", hand: "beidhaendig" }
          - id: "parcours"
            name: "Parcours"
            serien: 4
            trefferaufnahme_nach: [4]
            schuss_je_serie: 5
            distanzen_m: [20, 15, 10, 5]
            positionen:
              - nr: 5
                distanz_m: 20
                anschlaege:
                  - { haltung: "stehend", hand: "beidhaendig" }
                scheibe: 1
              - nr: 6
                distanz_m: 15
                anschlaege:
                  - { haltung: "kniend", hand: "beidhaendig" }
                  - { haltung: "stehend", hand: "schwache_hand" }
                scheibe: 2
              - nr: 7
