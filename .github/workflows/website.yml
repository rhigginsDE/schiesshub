# Veröffentlicht den Ordner website/ auf GitHub Pages (https://schiesshub.app).
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Platzhalter in Impressum und Datenschutz melden
        run: |
          if grep -rl "TODO-RECHTLICHES" website/ ; then
            echo "::warning::Impressum oder Datenschutz enthalten noch Platzhalter (TODO-RECHTLICHES)."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website

  # Eigener Job: Das Artefakt ist erst nach Abschluss des Build-Jobs zuverlässig abrufbar.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
